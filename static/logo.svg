<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Sampige Sunrise</title>
  <!-- Raghu's solar line as the sun, champak (sampige) petals as its rays,
       rising over the Bangsaen sea. Three waves: 2024 and 2025 faint, 2026 in gold. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1340c9"/><stop offset="1" stop-color="#3f82ff"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a2a8f"/><stop offset="1" stop-color="#061446"/></linearGradient>
    <radialGradient id="glow" cx="50" cy="62" r="46" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffc85a" stop-opacity=".5"/><stop offset="1" stop-color="#ffc85a" stop-opacity="0"/></radialGradient>
    <clipPath id="tile"><rect width="100" height="100" rx="22"/></clipPath>
    <clipPath id="above"><rect width="100" height="62"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="62" fill="url(#sky)"/>
    <rect width="100" height="62" fill="url(#glow)"/>
    <rect y="62" width="100" height="38" fill="url(#sea)"/>
    <g clip-path="url(#above)" fill="#f5b83d">
      <circle cx="50" cy="62" r="12.5"/>
      <g transform="translate(50 62)">
        <path d="M0,-16 C4.4,-21 4,-32 0.6,-40 C-2.8,-32 -3.6,-21 0,-16Z"/>
        <path transform="rotate(-24)" d="M0,-16 C4.2,-21 3.8,-29 0.6,-37 C-2.6,-29 -3.4,-21 0,-16Z"/>
        <path transform="rotate(24)" d="M0,-16 C4.2,-21 3.8,-29 0.6,-37 C-2.6,-29 -3.4,-21 0,-16Z"/>
        <path transform="rotate(-48)" d="M0,-16 C4,-20.5 3.6,-26 0.5,-33 C-2.5,-26 -3.2,-20.5 0,-16Z"/>
        <path transform="rotate(48)" d="M0,-16 C4,-20.5 3.6,-26 0.5,-33 C-2.5,-26 -3.2,-20.5 0,-16Z"/>
        <path transform="rotate(-72)" d="M0,-16 C3.6,-19.5 3.2,-23 0.4,-28.5 C-2.2,-23 -2.9,-19.5 0,-16Z"/>
        <path transform="rotate(72)" d="M0,-16 C3.6,-19.5 3.2,-23 0.4,-28.5 C-2.2,-23 -2.9,-19.5 0,-16Z"/>
      </g>
    </g>
    <g fill="none" stroke-linecap="round">
      <path d="M16,71 q8.5,-3.6 17,0 t17,0 t17,0 t17,0" stroke="#f5b83d" stroke-width="3.4"/>
      <path d="M22,80 q7,-3 14,0 t14,0 t14,0 t14,0" stroke="#7b98f2" stroke-opacity=".75" stroke-width="2.4"/>
      <path d="M28,88.5 q5.5,-2.6 11,0 t11,0 t11,0 t11,0" stroke="#7b98f2" stroke-opacity=".45" stroke-width="2.4"/>
    </g>
  </g>
</svg>
