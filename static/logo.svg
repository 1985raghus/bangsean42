<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Sampige Sunrise</title>
  <!-- The race computer's badge. Same story, machined: champak (sampige) petals
       as faceted rays, the sun on the Bangsaen horizon, and the three attempts
       as readout lines - 2024 and 2025 dim and dashed, 2026 solid and lit. -->
  <defs>
    <radialGradient id="glow" cx="50" cy="58" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc85a" stop-opacity=".32"/><stop offset="1" stop-color="#ffc85a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><path d="M14 2 H86 L98 14 V86 L86 98 H14 L2 86 V14 Z"/></clipPath>
    <clipPath id="above"><rect width="100" height="58"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="100" fill="#05080f"/>
    <rect width="100" height="58" fill="url(#glow)"/>
    <!-- sun + faceted petals, clipped at the horizon -->
    <g clip-path="url(#above)" fill="#f5b83d">
      <circle cx="50" cy="58" r="13"/>
      <g transform="translate(50 58)">
        <path d="M0,-17 L4.6,-26 L0,-42 L-4.6,-26 Z"/>
        <path transform="rotate(-24)" d="M0,-17 L4.4,-25 L0,-38 L-4.4,-25 Z"/>
        <path transform="rotate(24)"  d="M0,-17 L4.4,-25 L0,-38 L-4.4,-25 Z"/>
        <path transform="rotate(-48)" d="M0,-17 L4,-23.5 L0,-33 L-4,-23.5 Z"/>
        <path transform="rotate(48)"  d="M0,-17 L4,-23.5 L0,-33 L-4,-23.5 Z"/>
        <path transform="rotate(-72)" d="M0,-17 L3.6,-22 L0,-28.5 L-3.6,-22 Z"/>
        <path transform="rotate(72)"  d="M0,-17 L3.6,-22 L0,-28.5 L-3.6,-22 Z"/>
      </g>
    </g>
    <!-- horizon -->
    <rect x="2" y="57.4" width="96" height="1.2" fill="#aac3ff" fill-opacity=".28"/>
    <!-- three attempts: 2026 lit, 2025 and 2024 dim history -->
    <g stroke-linecap="square" fill="none">
      <path d="M16,71 H84" stroke="#f5b83d" stroke-opacity=".28" stroke-width="7"/>
      <path d="M16,71 H84" stroke="#f5b83d" stroke-width="3.6"/>
      <path d="M22,81 H78" stroke="#58679a" stroke-width="2.6" stroke-dasharray="8 5"/>
      <path d="M28,89.5 H72" stroke="#3b4668" stroke-width="2.6" stroke-dasharray="5 6"/>
    </g>
    <!-- bezel: hairline + corner ticks, echoing the app frame -->
    <path d="M14 2 H86 L98 14 V86 L86 98 H14 L2 86 V14 Z" fill="none" stroke="#aac3ff" stroke-opacity=".2" stroke-width="1.4"/>
    <path d="M8 16 V12 L12 8 H16 M84 92 H88 L92 88 V84" fill="none" stroke="#aac3ff" stroke-opacity=".5" stroke-width="2"/>
  </g>
</svg>
