<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Sampige Sunrise</title>
  <!-- Simplified for 16-32 px: bigger sun, five fatter petals, one gold wave. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1340c9"/><stop offset="1" stop-color="#3f82ff"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a2a8f"/><stop offset="1" stop-color="#061446"/></linearGradient>
    <clipPath id="tile"><rect width="100" height="100" rx="22"/></clipPath>
    <clipPath id="above"><rect width="100" height="64"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="64" fill="url(#sky)"/>
    <rect y="64" width="100" height="36" fill="url(#sea)"/>
    <g clip-path="url(#above)" fill="#f5b83d">
      <circle cx="50" cy="64" r="16"/>
      <g transform="translate(50 64)">
        <path d="M0,-21 C7,-27 6.5,-36 1,-46 C-4,-36 -6,-27 0,-21Z"/>
        <path transform="rotate(-32)" d="M0,-21 C6.6,-26.5 6,-33.5 1,-42 C-3.8,-33.5 -5.6,-26.5 0,-21Z"/>
        <path transform="rotate(32)" d="M0,-21 C6.6,-26.5 6,-33.5 1,-42 C-3.8,-33.5 -5.6,-26.5 0,-21Z"/>
        <path transform="rotate(-64)" d="M0,-21 C6,-25.5 5.4,-29.5 0.8,-36 C-3.4,-29.5 -5.2,-25.5 0,-21Z"/>
        <path transform="rotate(64)" d="M0,-21 C6,-25.5 5.4,-29.5 0.8,-36 C-3.4,-29.5 -5.2,-25.5 0,-21Z"/>
      </g>
    </g>
    <path d="M14,80 q9,-5.5 18,0 t18,0 t18,0 t18,0" fill="none" stroke="#f5b83d" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
