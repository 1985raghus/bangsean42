<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Road to Bangsaen - weekly card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@500;600;700;800&display=swap">
<style>
  /* 1080x1350 Instagram portrait. ONE number, ONE sentence, one photo.
     Every layer is absolutely positioned: next week's copy can never push the
     footer off the canvas. Render:  node social/render_card.mjs out.png [photo]
     Photo comes from ?photo=../images/Image1.jpg - without it the card is the
     type-only variant, dimensionally identical.

     Fixed across the series (never edit): canvas, 72px margins, logo at 72/60,
     week tab, progress bar at y150, wave crests 798/822/844, hero number at
     x72 with its baseline at y1044, quote baselines 1122/1171, footer 1290. */
  * { box-sizing: border-box; margin: 0; }
  :root {
    --ground: #0b1020;      /* the only background type ever sits on */
    --gold: #f5b83d;        /* exactly three uses: hero number, progress fill, wave 1 */
    --deep: #0a2a8f;        /* photo grade + dawn glow only, never behind gold */
    --wave: #7b98f2;
    --display: Anton, Impact, sans-serif;
    --font: Figtree, system-ui, sans-serif;
  }
  body { width: 1080px; height: 1350px; background: var(--ground); overflow: hidden; }
  .card { position: relative; width: 1080px; height: 1350px; background: var(--ground); overflow: hidden; }
  .layer { position: absolute; inset: 0; }

  /* photo, graded so eight amateur phone shots read as one series */
  /* 46% lifts the whole face clear of the waterline at y=798 on a 9:16 phone selfie.
     Shooting rule: keep your face between a third and two thirds up the frame. */
  .photo { width: 100%; height: 100%; object-fit: cover; object-position: 50% 46%; filter: saturate(.92) contrast(1.06) brightness(.94); }
  .grade { background: var(--deep); mix-blend-mode: color; opacity: .28; }
  .scrim-top { background: linear-gradient(180deg, rgba(11,16,32,.90) 0, rgba(11,16,32,.48) 170px, rgba(11,16,32,0) 330px); }
  .scrim-bottom { background: linear-gradient(0deg, #0b1020 0, rgba(11,16,32,.97) 300px, rgba(11,16,32,.80) 470px, rgba(11,16,32,.30) 620px, rgba(11,16,32,0) 760px); }
  /* type-only variant: a dawn glow low down so gold never lands on blue */
  .glow { background: radial-gradient(900px 520px at 540px 1400px, rgba(245,184,61,.10) 0%, rgba(19,64,201,.34) 34%, rgba(11,16,32,0) 74%); }

  /* header */
  .logo { position: absolute; left: 72px; top: 60px; width: 56px; height: 56px; border-radius: 14px; }
  .wordmark { position: absolute; left: 148px; top: 60px; }
  .wordmark .l1 { font: 800 24px/1 var(--font); letter-spacing: .20em; text-transform: uppercase; color: #fff; }
  .wordmark .l2 { font: 600 20px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.62); margin-top: 10px; }
  .weektab { position: absolute; right: 72px; top: 46px; font: 400 52px/1 var(--display); color: var(--gold); }

  /* progress bar: the series device - gold creeps left to right over 11 weeks */
  .bars { position: absolute; left: 72px; top: 150px; width: 936px; height: 10px; display: flex; gap: 10px; }
  .bars i { flex: 1; border-radius: 5px; background: rgba(255,255,255,.14); }
  .bars i.on { background: var(--gold); }

  /* the waterline, lifted from the logo: where the picture ends and the number starts */
  .waves { position: absolute; left: -20px; top: 780px; width: 1120px; height: 90px; }

  /* the one thing this card is about */
  /* kicker sits ABOVE the waterline; the hero number owns everything below it */
  .kicker { position: absolute; left: 72px; top: 726px; font: 700 22px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.6); }
  /* one baseline row: 264px numeral, then unit, then the outlined old value */
  .hero { position: absolute; left: 72px; top: 844px; display: flex; align-items: baseline; gap: 22px; }
  .hero .n { font: 400 264px/.78 var(--display); color: var(--gold); }
  .hero .unit { font: 400 60px/1 var(--display); color: #fff; }
  .hero .was { font: 400 60px/1 var(--display); color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,.45); margin-left: 18px; }

  .quote { position: absolute; left: 72px; top: 1082px; width: 860px; font: 500 40px/1.22 var(--font); color: #fff; }
  .quote q { quotes: '\201C' '\201D'; }
  .quote q::before, .quote q::after { color: rgba(255,255,255,.55); }
  .cost { position: absolute; left: 72px; top: 1208px; font: 600 26px/1 var(--font); color: rgba(255,255,255,.66); }
  .foot { position: absolute; left: 72px; right: 72px; top: 1274px; display: flex; justify-content: space-between;
    font: 700 20px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.5); }
</style>
</head>
<body>
  <div class="card">
    <img class="layer photo" id="photo" alt="" hidden>
    <div class="layer grade" id="grade" hidden></div>
    <div class="layer glow" id="glow"></div>
    <div class="layer scrim-top" id="scrimTop" hidden></div>
    <div class="layer scrim-bottom" id="scrimBottom" hidden></div>

    <img class="logo" src="../static/logo.svg" alt="">
    <div class="wordmark">
      <div class="l1">Road to Bangsaen</div>
      <div class="l2">Bangsaen Marathon &middot; 15 Nov 2026</div>
    </div>
    <div class="weektab">W04</div>

    <div class="bars">
      <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <svg class="waves" viewBox="0 0 1120 90" aria-hidden="true">
      <path d="M0,18 q45,-14 90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0" fill="none" stroke="#f5b83d" stroke-width="5" stroke-linecap="round"/>
      <path d="M0,42 q45,-12 90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0" fill="none" stroke="#7b98f2" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
      <path d="M0,64 q45,-10 90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0 t90,0" fill="none" stroke="#7b98f2" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/>
    </svg>

    <div class="kicker">Same easy run &middot; 3 weeks apart</div>
    <div class="hero"><span class="n">153</span><span class="unit">bpm</span><span class="was">was 168</span></div>

    <div class="quote"><q>Slower runners passed me. I finished calm, with fuel in the tank.</q></div>
    <div class="cost">7:30/km &mdash; 59 sec/km slower than three weeks ago.</div>
    <div class="foot"><span>Week 4 of 11 &middot; 52 days to go</span><span>Sub-4:00 &middot; Attempt #3</span></div>
  </div>

<script>
  // ?photo=../images/Image1.jpg turns on the photo version; no photo keeps the
  // dawn-glow type version at exactly the same dimensions.
  const src = new URLSearchParams(location.search).get('photo');
  if (src) {
    for (const id of ['photo', 'grade', 'scrimTop', 'scrimBottom']) document.getElementById(id).hidden = false;
    document.getElementById('glow').hidden = true;
    document.getElementById('photo').src = src;
  }
</script>
</body>
</html>
