<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bangsaen">
<title>Bangsaen Training</title>
<link rel="icon" href="/static/logo-small.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
  /* SCORE-FIRST.
     v2 of the redesign, after the owner's verdict on v1: same layout = same app.
     So the structure changes: soft glass cards on true black, ring gauges where
     a score leads, a floating pill dock. Gold keeps its two jobs - the hero,
     and what was actually run. Selector and variable names are still the same
     contract the JS renders against. */
  :root {
    color-scheme: dark;
    --ground: #04060c; --ground-2: #0d1526; --ground-3: #172139;
    --card-a: #121a2f; --card-b: #0b1222;
    --line: rgba(170,195,255,.10); --line-strong: rgba(170,195,255,.22);
    --ink: #eef3ff; --ink-2: #9fabc9; --ink-3: #6b77a0; --ink-4: #333d5c;
    --gold: #f5b83d; --gold-14: rgba(245,184,61,.14); --gold-40: rgba(245,184,61,.4);
    --good: #3ad29a; --crit: #ff6b57; --aqua: #58c6f2;
    --f-hero: "Anton", Impact, sans-serif;
    --f-ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --t-hero: clamp(58px, 19vw, 80px); --t-1: 40px; --t-2: 28px; --t-3: 20px;
    --t-body: 15.5px; --t-sub: 14px; --t-micro: 12px;
    --r-1: 10px; --r-2: 16px; --r-3: 24px;
    --gutter: 16px; --hit: 44px;
    --ease-out: cubic-bezier(.2,.8,.2,1); --ease-io: cubic-bezier(.65,0,.35,1);
    --ease-expo: cubic-bezier(.16,1,.3,1);
    --ease-land: linear(0, .006, .025 2.8%, .101 6.1%, .539 18.9%, .721 25.3%, .849 31.5%, .937 38.1%, .968 41.8%, .991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001);
    --d-tap: 80ms; --d-fast: 150ms; --d-base: 240ms; --d-slow: 420ms;
    --dawn-gold: .07; --dawn-blue: .14;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body { background: var(--ground); color: var(--ink); font: var(--t-body)/1.5 var(--f-ui); font-feature-settings: "tnum"; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(130% 55% at 50% -24%, rgba(245,184,61,var(--dawn-gold)) 0%, rgba(42,84,214,var(--dawn-blue)) 38%, rgba(4,6,12,0) 72%); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :is(button, input, textarea, [tabindex]):focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
  .mono { font: 500 var(--t-micro)/1.3 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }
  .sub { font: 400 var(--t-sub)/1.45 var(--f-ui); color: var(--ink-2); }
  .dim { color: var(--ink-3); }
  .crit { color: var(--crit); } .good { color: var(--good); }
  .hide { display: none !important; }

  .led { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); animation: led 2.6s var(--ease-io) infinite; }
  @keyframes led { 50% { opacity: .45; box-shadow: 0 0 3px var(--good); } }
  .devname { font: 500 11px/1 var(--f-mono); letter-spacing: .16em; color: var(--ink-3); }
  @media (max-width: 430px) { .devname { display: none; } }

  /* wake sweep: one pass on power-on */
  #app-view::after { content: ""; position: fixed; left: 0; right: 0; top: -4px; height: 2px; z-index: 50; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .8;
    animation: wake 820ms var(--ease-io) 80ms both; }
  @keyframes wake { from { transform: translateY(0); opacity: .9; } to { transform: translateY(104vh); opacity: 0; } }

  /* shell */
  header.bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top)) var(--gutter) 10px;
    background: color-mix(in srgb, var(--ground) 82%, transparent); backdrop-filter: blur(14px); }
  header.bar img { width: 26px; height: 26px; border-radius: 8px; }
  header.bar .who { flex: 1; display: flex; align-items: baseline; gap: 10px; min-width: 0; white-space: nowrap; }
  header.bar .who .mono { overflow: hidden; text-overflow: ellipsis; }
  header.bar .wk { font: 400 20px/1 var(--f-hero); letter-spacing: .02em; color: var(--ink); }
  .icon { width: var(--hit); height: var(--hit); display: grid; place-items: center; color: var(--ink-2);
    background: var(--ground-2); border: 1px solid var(--line); border-radius: 14px;
    transition: transform var(--d-tap), background var(--d-fast), color var(--d-fast); }
  .icon:active { transform: scale(.94); background: var(--ground-3); color: var(--ink); }
  .icon svg { width: 20px; height: 20px; }
  .icon.spin svg { animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { padding: 4px var(--gutter) calc(118px + env(safe-area-inset-bottom)); max-width: 620px; margin: 0 auto; }
  /* every section is a card now: soft glass on true black */
  .view > section { background: linear-gradient(180deg, var(--card-a), var(--card-b));
    border: 1px solid var(--line); border-radius: var(--r-3); padding: 20px 18px; margin: 12px 0;
    box-shadow: 0 14px 34px -22px rgba(0,0,0,.9); }
  .view > section:first-child { margin-top: 10px; }

  /* floating pill dock */
  nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 20;
    display: flex; gap: 6px; padding: 7px; border-radius: 999px;
    background: color-mix(in srgb, var(--ground-2) 82%, transparent); backdrop-filter: blur(18px);
    border: 1px solid var(--line-strong); box-shadow: 0 16px 40px -18px rgba(0,0,0,.9); }
  nav.tabs button { position: relative; padding: 11px 22px; border-radius: 999px; font: 600 13.5px/1 var(--f-ui);
    letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3);
    transition: color var(--d-fast), background var(--d-fast), transform var(--d-tap); }
  nav.tabs button:active { transform: scale(.95); }
  nav.tabs button[aria-selected="true"] { color: var(--ink); background: var(--ground-3); }
  nav.tabs .slider { position: absolute; left: 0; bottom: 4px; height: 2px; width: 20px;
    background: var(--gold); border-radius: 2px; box-shadow: 0 0 10px var(--gold-40);
    transition: transform var(--d-base) var(--ease-out); }

  /* rings: the score language */
  .ring { display: block; flex: none; }
  .ring .rtrack { fill: none; stroke: rgba(170,195,255,.12); stroke-width: 8; }
  .ring .arc { fill: none; stroke-width: 8; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 48px 48px;
    transition: stroke-dashoffset 900ms var(--ease-out); }
  .ring .rbig { font: 600 25px var(--f-ui); fill: var(--ink); font-variant-numeric: tabular-nums; }
  .ring .rsub { font: 500 8.5px var(--f-mono); letter-spacing: .14em; fill: var(--ink-3); text-transform: uppercase; }
  .cardhead { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .cardhead .grow { flex: 1; min-width: 0; }
  .scorehead { display: flex; align-items: center; gap: 16px; }
  .scorehead .grow { flex: 1; min-width: 0; }

  /* rows */
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .lead { font: 600 var(--t-3)/1.25 var(--f-ui); letter-spacing: 0; }
  .row .meta { margin-top: 2px; }
  .row .val { text-align: right; white-space: nowrap; font: 500 var(--t-sub)/1.3 var(--f-mono); letter-spacing: .02em; color: var(--ink-2); }
  .row.wk-row, .row.sess-row { background: none; transition: background var(--d-fast); border-radius: var(--r-1); }
  .row.wk-row:active, .row.sess-row:active { background: var(--ground-2); }
  .chev { width: 18px; height: 18px; flex: none; color: var(--ink-3); transition: transform var(--d-base) var(--ease-out); }
  .wk-row[aria-expanded="true"] .chev { transform: rotate(90deg); }

  /* hero block */
  .kicker { margin-bottom: 10px; }
  .hero { font: 400 var(--t-hero)/.9 var(--f-hero); letter-spacing: .01em; display: flex; align-items: baseline; gap: 10px; }
  .hero small { font: 500 15px/1 var(--f-ui); color: var(--ink-2); letter-spacing: .02em; }
  .hero.gold { color: var(--gold); text-shadow: 0 0 28px rgba(245,184,61,.32); }
  .second { font: 400 var(--t-1)/1 var(--f-hero); letter-spacing: .01em; }
  .why { margin-top: 14px; display: flex; gap: 9px; align-items: flex-start; }
  .why img { width: 15px; height: 15px; margin-top: 4px; opacity: .55; flex: none; }
  .why p { font: 400 var(--t-body)/1.45 var(--f-ui); color: var(--ink-2); }
  .why b { color: var(--ink); font-weight: 600; }

  /* the band */
  svg.band, svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .band .track { stroke: var(--ink-4); stroke-width: 2; stroke-linecap: round; }
  .band .zone { fill: var(--gold); filter: drop-shadow(0 0 6px rgba(245,184,61,.35)); }
  .band .glow { fill: var(--gold-14); opacity: 0; transition: opacity 320ms var(--ease-io); }
  .band .zone, .band .glow { transform-origin: center; }
  .band.in .glow { opacity: 1; }
  .band .mark { fill: var(--ink); stroke: var(--card-b); stroke-width: 3; }
  .band .ghost { fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
  .band .lbl { font: 400 var(--t-2) var(--f-hero); fill: var(--ink); }
  .band .ax { font: 500 11px var(--f-mono); fill: var(--ink-3); letter-spacing: .06em; }
  .band .delta { font: 500 12px var(--f-mono); fill: var(--crit); }
  .band .lead-line { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
  @keyframes bandIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes markLand { from { transform: translateX(var(--from)); } to { transform: translateX(0); } }
  .anim .zone, .anim .glow { animation: bandIn 500ms var(--ease-out) both; }
  .anim .mark-g { animation: markLand 700ms var(--ease-land) 120ms both; }
  @keyframes pulse { 50% { transform: scaleY(1.25); } }
  .band.in.anim .zone { animation: bandIn 500ms var(--ease-out) both, pulse 320ms var(--ease-io) 700ms; }

  /* splits */
  .split { display: flex; align-items: center; gap: 10px; height: 26px; }
  .split .n { width: 18px; text-align: right; color: var(--ink-3); }
  .split .bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(170,195,255,.07); }
  .split .bar i { display: block; height: 100%; border-radius: 3px; }
  .split .p { width: 52px; text-align: right; font: 500 14px var(--f-mono); color: var(--ink); }
  .split .h { width: 30px; text-align: right; }

  /* charts */
  .chart .ref { stroke: var(--line-strong); stroke-width: 1; }
  .chart .ax { font: 500 11px var(--f-mono); fill: var(--ink-3); letter-spacing: .06em; }
  .chart .now { font: 500 12px var(--f-mono); fill: var(--ink); letter-spacing: .06em; }
  .chart .ribbon { fill: var(--gold-14); stroke: var(--gold-40); stroke-width: 1; }
  @keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .drawn .gy { animation: growY var(--d-slow) var(--ease-out) both; transform-origin: bottom; }

  /* week strip */
  .strip { display: flex; align-items: flex-end; gap: 5px; }
  .strip .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .strip .stack { position: relative; width: 100%; max-width: 26px; border-radius: 8px; background: var(--ground-3); }
  .strip .stack i { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; border-radius: 8px;
    background: linear-gradient(180deg, #ffd071, var(--gold)); box-shadow: 0 0 12px -2px rgba(245,184,61,.5);
    transform: scaleY(0); transform-origin: bottom; transition: transform var(--d-slow) var(--ease-out); }
  .strip .col.today .stack { box-shadow: 0 0 0 1.5px var(--ink), 0 0 18px -4px rgba(245,184,61,.5); }
  .strip .col.missed .stack { background: rgba(255,107,87,.2); }
  .strip .rest { height: 4px; width: 14px; border-radius: 2px; background: var(--ink-4); }
  .strip .km { font: 500 11px/1 var(--f-mono); color: var(--ink-2); }
  .strip .dow { font: 500 11px/1 var(--f-mono); color: var(--ink-3); text-transform: uppercase; }

  /* the 11 weeks */
  .weeks { display: flex; gap: 4px; }
  .weeks .wkseg { position: relative; flex: 1; height: 12px; border-radius: 6px; background: var(--ground-3); overflow: hidden; }
  .weeks .wkseg i { position: absolute; inset: 0; width: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--gold), #ffd071); transform: scaleX(0); transform-origin: left; transition: transform var(--d-slow) var(--ease-out); }
  .weeks .wkseg.now { box-shadow: 0 0 0 1.5px var(--ink); }
  .weeks .wkseg.race { background: transparent; box-shadow: none; display: grid; place-items: center; }

  /* contributors */
  .contrib { padding: 12px 0; border-top: 1px solid var(--line); }
  .contrib:first-child { border-top: 0; }
  .contrib .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .contrib .verdict { font: 500 var(--t-sub) var(--f-ui); }
  .contrib .track { position: relative; height: 3px; background: var(--ink-4); margin-top: 9px; border-radius: 2px; }
  .contrib .track .tick { position: absolute; top: -3px; width: 1px; height: 9px; background: var(--line-strong); }
  .contrib .track .mk { position: absolute; top: -2px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); transform: translateX(-3px); transition: left var(--d-slow) var(--ease-out); }

  /* scales */
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 12px; }
  .scale button { position: relative; min-height: 56px; border-radius: var(--r-2); background: var(--ground-2); border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform var(--d-tap), background var(--d-fast), color var(--d-fast); }
  .scale button:active { transform: scale(.96); background: var(--ground-3); }
  .scale button .n { font: 600 var(--t-3)/1 var(--f-ui); font-variant-numeric: tabular-nums; }
  .scale button .w { font: 500 10.5px/1 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
  .scale button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--ground); }
  .scale button[aria-pressed="true"] .w { color: var(--ground); opacity: .75; }
  .scale button.planned::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 6px; height: 2px; border-radius: 2px; background: var(--gold-40); }
  .scale.ten button .w { text-align: center; line-height: 1.15; white-space: normal; padding: 0 4px; min-height: 1.15em; }

  .status-line { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
  .status-line .grow > span { display: block; }
  .status-line[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .status-line:disabled { cursor: default; }
  .status-line:disabled .chev { display: none; }

  .dual { display: flex; gap: 26px; align-items: flex-end; flex-wrap: wrap; }
  .dual .second.dim { color: var(--ink-3); }

  .note-field { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; }
  textarea, input[type="number"], input[type="date"], input[type="text"], input[type="password"] {
    width: 100%; min-height: var(--hit); padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--r-2);
    background: var(--ground-2); color: var(--ink); font: 400 var(--t-body) var(--f-ui); resize: vertical; }
  textarea { min-height: 52px; }
  input:focus, textarea:focus { border-color: var(--gold-40); }
  .ghost { min-height: var(--hit); padding: 0 20px; border-radius: 999px; background: var(--ground-2); border: 1px solid var(--line);
    font: 600 var(--t-sub) var(--f-ui); letter-spacing: .03em;
    transition: transform var(--d-tap), background var(--d-fast); }
  .ghost:active { transform: scale(.96); background: var(--ground-3); }
  .ghost.wide { width: 100%; }
  .linkish { font: 500 var(--t-sub) var(--f-ui); color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }

  /* sheet */
  dialog { width: 100%; max-width: 100%; margin: auto 0 0; padding: 24px var(--gutter) calc(24px + env(safe-area-inset-bottom));
    border: 0; border-top: 1px solid var(--gold-40); border-radius: var(--r-3) var(--r-3) 0 0;
    background: linear-gradient(180deg, var(--card-a), var(--card-b)); color: var(--ink); }
  dialog::backdrop { background: rgba(2,4,9,.7); backdrop-filter: blur(3px); }
  dialog h2 { font: 600 var(--t-2)/1.2 var(--f-ui); letter-spacing: -.01em; }
  dialog .close { width: var(--hit); height: var(--hit); border-radius: 50%; background: var(--ground-3); font-size: 20px; }
  dialog .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  dialog .stack { display: grid; gap: 10px; }
  @media (min-width: 600px) { dialog { margin: auto; max-width: 420px; border-radius: var(--r-3); border: 1px solid var(--line-strong); } }
  @media (prefers-reduced-motion: no-preference) {
    dialog[open] { animation: sheetIn 320ms var(--ease-out); }
    @keyframes sheetIn { from { transform: translateY(100%); } }
  }

  @keyframes enter { from { opacity: 0; transform: translateY(12px) scale(.985); } }
  .view.fresh > section { animation: enter var(--d-slow) var(--ease-out) both; animation-delay: calc(var(--i, 0) * 50ms); }

  .skel { display: grid; gap: 14px; padding-top: 24px; }
  .skel i { display: block; height: 13px; border-radius: 7px; background: var(--ink-4); animation: breathe 1.1s var(--ease-io) infinite alternate; }
  .skel i.big { height: 58px; border-radius: var(--r-2); }
  .skel i.mid { height: 24px; width: 60%; }
  .skel i:nth-child(2) { animation-delay: .12s; }
  .skel i:nth-child(3) { animation-delay: .24s; }
  .skel i:nth-child(4) { animation-delay: .36s; }
  @keyframes breathe { from { opacity: .35; } to { opacity: .85; } }

  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px); z-index: 40;
    opacity: 0; pointer-events: none; background: var(--ink); color: var(--ground); font: 600 var(--t-sub) var(--f-ui);
    padding: 11px 18px; border-radius: 999px; transition: opacity var(--d-base), transform var(--d-base) var(--ease-out); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  .connect { max-width: 400px; margin: 0 auto; padding: 56px var(--gutter); }
  .connect img.mark { width: 52px; height: 52px; border-radius: 12px; margin-bottom: 20px; }
  .connect h1 { font: 400 44px/.95 var(--f-hero); text-transform: uppercase; letter-spacing: .01em; margin: 6px 0 12px; }
  .connect label { display: block; margin-top: 12px; }
  .connect label span { display: block; margin-bottom: 6px; }


  /* ===== v3 "Runny": glossy capsules, a lime GO card, day chips on dotted black ===== */
  :root {
    --brand: #7b5cff; --brand-2: #b15cff;
    --dawn: linear-gradient(135deg, #7b5cff 0%, #b15cff 50%, #ff8a3c 110%);
    --lime-a: #c6ee2c; --lime-b: #eef24a; --lime-ink: #dff24f;
    --cap-top: #2b2556; --cap-bot: #15112e;
  }
  /* dotted phosphor ground under the dawn glow */
  body::before { background:
      radial-gradient(130% 55% at 50% -24%, rgba(177,92,255,.16) 0%, rgba(42,84,214,.12) 40%, rgba(4,6,12,0) 72%),
      radial-gradient(rgba(170,195,255,.07) 1px, transparent 1.4px) !important;
    background-size: auto, 22px 22px !important; }

  #s-summary { padding: 0; background: none; border: 0; box-shadow: none; margin-top: 8px; }
  .greet { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .greet .g1 { font: 400 26px/1 var(--f-hero); letter-spacing: .01em; }
  .greet .g2 { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

  .daychips { display: flex; gap: 6px; margin-top: 16px; }
  .daychip { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 0; border-radius: 16px; background: var(--ground-2); border: 1px solid var(--line); }
  .daychip b { font: 600 15px/1 var(--f-ui); font-variant-numeric: tabular-nums; }
  .daychip span { font: 600 9.5px/1 var(--f-mono); text-transform: uppercase; color: var(--ink-3); }
  .daychip.done { color: var(--good); } .daychip.done span { color: var(--good); }
  .daychip.now { background: var(--dawn); border-color: transparent; color: #fff; box-shadow: 0 8px 20px -8px var(--brand); }
  .daychip.now span { color: rgba(255,255,255,.85); }

  /* the GO card: today's instruction, as the one bright surface */
  .gocard { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 14px;
    border-radius: 26px; padding: 22px 24px; background: linear-gradient(118deg, var(--lime-a), var(--lime-b) 62%, #f2d93c);
    color: #16200a; box-shadow: 0 18px 40px -20px rgba(198,238,44,.6); width: 100%; text-align: left; }
  .gocard:active { transform: scale(.985); }
  .gocard .mono { color: #33460f; }
  .gocard .goline { font: 600 15px/1.2 var(--f-ui); color: #1b2708; margin-top: 5px; }
  .gocard .gobig { font: 400 clamp(32px, 10vw, 46px)/.86 var(--f-hero); color: #121b04; text-align: right; letter-spacing: .01em; }
  .gocard .gobig small { font: 600 13px var(--f-ui); }

  /* glossy violet capsules - the signature stat tile */
  .caprow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .cap { position: relative; border-radius: 22px; padding: 16px 8px 15px; text-align: center; overflow: hidden;
    background: linear-gradient(180deg, var(--cap-top), var(--cap-bot)); border: 1px solid rgba(170,140,255,.2); }
  .cap::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52%;
    background: linear-gradient(180deg, rgba(175,140,255,.4), transparent); pointer-events: none; }
  .capicon { position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    margin: 0 auto 11px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff;
    box-shadow: 0 6px 14px -5px var(--brand); }
  .capicon svg { width: 17px; height: 17px; }
  .caplbl { position: relative; display: block; font: 600 9.5px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
  .capnum { position: relative; display: block; font: 600 23px/1 var(--f-ui); color: var(--lime-ink); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .capunit { position: relative; font: 600 9.5px var(--f-mono); text-transform: uppercase; color: var(--ink-3); }

  /* circular week chips */
  .wkchips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font: 600 13px/1 var(--f-ui); background: var(--ground-2); border: 1px solid var(--line); color: var(--ink-3); }
  .chip.done { background: var(--ground-3); color: var(--ink); }
  .chip.done svg { width: 17px; height: 17px; color: var(--good); }
  .chip.now { background: var(--dawn); color: #fff; border-color: transparent; box-shadow: 0 8px 20px -6px var(--brand); }
  .chip.race { background: none; border-style: dashed; border-color: var(--gold-40); color: var(--gold); }
  .chip.race svg { width: 16px; height: 16px; }

  /* dock: active key is a filled gradient pill */
  nav.tabs button[aria-selected="true"] { color: #fff; background: var(--dawn); }
  nav.tabs .slider { display: none; }


  /* ===== simplification: a readiness pill, a tappable last-run, breathing room ===== */
  .rpill { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 var(--f-mono); letter-spacing: .04em;
    padding: 6px 11px; border-radius: 999px; background: var(--ground-2); border: 1px solid var(--line); color: var(--ink-2); }
  .rpill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .rpill.green::before { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .rpill.amber::before { background: var(--gold); box-shadow: 0 0 8px var(--gold-40); }
  .rpill.red::before { background: var(--crit); box-shadow: 0 0 8px var(--crit); }
  .lastrun-head { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 18px; }
  .lastrun-head .chev { width: 16px; height: 16px; color: var(--ink-3); }
  .minirow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .minicard { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--ground-2); border: 1px solid var(--line); border-radius: var(--r-2); padding: 14px 16px;
    transition: transform var(--d-tap), background var(--d-fast); }
  .minicard:active { transform: scale(.97); background: var(--ground-3); }
  .minicard .mc-main { flex: 1; min-width: 0; }
  .minicard .mc-big { font: 400 24px/1 var(--f-hero); letter-spacing: .01em; }
  .minicard .mc-big.gold { color: var(--gold); }
  .minicard .mc-lbl { font: 600 9.5px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-top: 6px; }


  /* ===== Plan segmented control: one job per view (Schedule / Progress / Fuel) ===== */
  .seg { display: flex; gap: 4px; padding: 4px; margin: 2px 0 6px; border-radius: 999px;
    background: var(--ground-2); border: 1px solid var(--line); position: sticky; top: calc(58px + env(safe-area-inset-top)); z-index: 10;
    backdrop-filter: blur(10px); }
  .seg button { flex: 1; min-width: 0; padding: 11px 6px; border-radius: 999px; font: 600 12px/1 var(--f-ui);
    letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3);
    transition: color var(--d-fast), background var(--d-fast), transform var(--d-tap); }
  .seg button:active { transform: scale(.96); }
  .seg button[aria-selected="true"] { color: #fff; background: var(--dawn); box-shadow: 0 6px 16px -8px var(--brand); }
  #plan-body .view-note { font: 400 var(--t-sub) var(--f-ui); color: var(--ink-3); margin: 2px 2px 0; }


  /* ===== adaptive: a slim live-conditions strip, tap for detail ===== */
  .wx { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; margin-top: 14px;
    padding: 11px 14px; border-radius: var(--r-2); background: var(--ground-2); border: 1px solid var(--line);
    transition: transform var(--d-tap), background var(--d-fast); }
  .wx:active { transform: scale(.98); background: var(--ground-3); }
  .wx .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .wx .dot.comfortable { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .wx .dot.warm { background: var(--gold); box-shadow: 0 0 8px var(--gold-40); }
  .wx .dot.hot { background: var(--brand-3); box-shadow: 0 0 8px var(--brand-3); }
  .wx .dot.extreme { background: var(--crit); box-shadow: 0 0 8px var(--crit); }
  .wx .wxmain { flex: 1; min-width: 0; font: 500 13px/1.3 var(--f-ui); color: var(--ink-2); }
  .wx .wxmain b { color: var(--ink); font-weight: 600; }
  .wx .chev { width: 15px; height: 15px; color: var(--ink-3); flex: none; }
  .wxsheet .mono { margin-top: 16px; }
  .wxsheet .big { font: 400 40px/1 var(--f-hero); color: var(--ink); margin-top: 4px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    #app-view::after { display: none; }
  }
</style>
