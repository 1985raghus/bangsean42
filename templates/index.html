<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bangsaen">
<title>Bangsaen Training</title>
<link rel="icon" href="/static/logo-small.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
  /* An instrument at dawn, not a dashboard.
     Ground + one horizon glow as the only light source. No cards: things separate
     by air and hairlines. Surfaces exist only where you can touch them.
     Gold means two things only - the one hero per screen, and what you actually did. */
  :root {
    color-scheme: dark;
    --ground: #0b1020; --ground-2: #10172a; --ground-3: #182038;
    --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16);
    --ink: #f4f6fb; --ink-2: #a9b3cc; --ink-3: #7682a3; --ink-4: #3d4660;
    --gold: #f5b83d; --gold-14: rgba(245,184,61,.14); --gold-40: rgba(245,184,61,.4);
    --good: #3ad29a; --crit: #ff6b57;
    --f-hero: "Anton", Impact, sans-serif;
    --f-ui: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --t-hero: clamp(58px, 19vw, 80px); --t-1: 40px; --t-2: 28px; --t-3: 20px;
    --t-body: 16px; --t-sub: 14px; --t-micro: 12px;
    --r-1: 6px; --r-2: 12px; --r-3: 20px;
    --gutter: 20px; --hit: 44px;
    --ease-out: cubic-bezier(.2,.8,.2,1); --ease-io: cubic-bezier(.65,0,.35,1);
    --ease-expo: cubic-bezier(.16,1,.3,1);
    --ease-land: linear(0, .006, .025 2.8%, .101 6.1%, .539 18.9%, .721 25.3%, .849 31.5%, .937 38.1%, .968 41.8%, .991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001);
    --d-tap: 90ms; --d-fast: 160ms; --d-base: 240ms; --d-slow: 420ms;
    --dawn-gold: .10; --dawn-blue: .22;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }  /* class rules below would otherwise win */
  body { background: var(--ground); color: var(--ink); font: var(--t-body)/1.5 var(--f-ui); font-feature-settings: "tnum"; }
  body::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: 58vh; z-index: -1; pointer-events: none;
    background: radial-gradient(130% 70% at 50% -30%, rgba(245,184,61,var(--dawn-gold)) 0%, rgba(19,64,201,var(--dawn-blue)) 38%, rgba(11,16,32,0) 72%); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :is(button, input, textarea, [tabindex]):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
  .mono { font: 500 var(--t-micro)/1.3 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; }
  .sub { font: 500 var(--t-sub)/1.4 var(--f-ui); color: var(--ink-2); }
  .dim { color: var(--ink-3); }
  .crit { color: var(--crit); } .good { color: var(--good); }
  .hide { display: none !important; }

  /* shell */
  header.bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) var(--gutter) 10px; background: var(--ground); }
  header.bar img { width: 24px; height: 24px; border-radius: 7px; }
  header.bar .who { flex: 1; display: flex; align-items: baseline; gap: 8px; }
  header.bar .wk { font: 400 20px/1 var(--f-hero); color: var(--ink); }
  .icon { width: var(--hit); height: var(--hit); display: grid; place-items: center; color: var(--ink-2); border-radius: var(--r-2); transition: transform var(--d-tap), background var(--d-fast); }
  .icon:active { transform: scale(.94); background: var(--ground-2); }
  .icon svg { width: 20px; height: 20px; }
  .icon.spin svg { animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { padding: 0 var(--gutter) calc(96px + env(safe-area-inset-bottom)); max-width: 620px; margin: 0 auto; }
  .view > section { padding-block: 40px; }
  .view > section:first-child { padding-top: 8px; }
  .view > section + section { border-top: 1px solid var(--line); }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 4px;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); background: var(--ground); border-top: 1px solid var(--line); }
  nav.tabs button { position: relative; padding: 12px 22px; font: 600 15px/1 var(--f-ui); color: var(--ink-3); transition: color var(--d-fast); }
  nav.tabs button[aria-selected="true"] { color: var(--ink); }
  nav.tabs .slider { position: absolute; bottom: calc(6px + env(safe-area-inset-bottom)); height: 2px; width: 20px; background: var(--ink); border-radius: 2px; transition: transform var(--d-base) var(--ease-out); }

  /* rows: the default layout, no boxes */
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .lead { font: 600 var(--t-3)/1.25 var(--f-ui); letter-spacing: -.01em; }
  .row .meta { margin-top: 2px; }
  .row .val { text-align: right; white-space: nowrap; font: 500 var(--t-sub)/1.3 var(--f-mono); letter-spacing: .02em; color: var(--ink-2); }

  /* hero block */
  .kicker { margin-bottom: 10px; }
  .hero { font: 400 var(--t-hero)/.9 var(--f-hero); letter-spacing: 0; display: flex; align-items: baseline; gap: 10px; }
  .hero small { font: 400 16px/1 var(--f-ui); color: var(--ink-2); }
  .hero.gold { color: var(--gold); }
  .second { font: 400 var(--t-1)/1 var(--f-hero); }
  .why { margin-top: 14px; display: flex; gap: 9px; align-items: flex-start; }
  .why img { width: 15px; height: 15px; margin-top: 4px; opacity: .55; flex: none; }
  .why p { font: 400 var(--t-body)/1.45 var(--f-ui); color: var(--ink-2); }
  .why b { color: var(--ink); font-weight: 600; }

  /* the band: the signature element */
  svg.band, svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  .band .track { stroke: var(--ink-4); stroke-width: 2; stroke-linecap: round; }
  .band .zone { fill: var(--gold); }
  .band .glow { fill: var(--gold-14); opacity: 0; transition: opacity 320ms var(--ease-io); }
  .band .zone, .band .glow { transform-origin: center; }
  .band.in .glow { opacity: 1; }
  .band .mark { fill: var(--ink); stroke: var(--ground); stroke-width: 3; }
  .band .ghost { fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
  .band .lbl { font: 400 var(--t-2) var(--f-hero); fill: var(--ink); }
  .band .ax { font: 500 11px var(--f-mono); fill: var(--ink-3); letter-spacing: .04em; }
  .band .delta { font: 500 12px var(--f-mono); fill: var(--crit); }
  .band .lead-line { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
  @keyframes bandIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes markLand { from { transform: translateX(var(--from)); } to { transform: translateX(0); } }
  .anim .zone, .anim .glow { animation: bandIn 500ms var(--ease-out) both; }
  .anim .mark-g { animation: markLand 700ms var(--ease-land) 120ms both; }
  @keyframes pulse { 50% { transform: scaleY(1.25); } }
  .band.in.anim .zone { animation: bandIn 500ms var(--ease-out) both, pulse 320ms var(--ease-io) 700ms; }

  /* charts */
  .chart .ref { stroke: var(--line-strong); stroke-width: 1; }
  .chart .ax { font: 500 11px var(--f-mono); fill: var(--ink-3); letter-spacing: .04em; }
  .chart .now { font: 500 12px var(--f-mono); fill: var(--ink); letter-spacing: .04em; }
  .chart .ribbon { fill: var(--gold-14); stroke: var(--gold-40); stroke-width: 1; }
  @keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .drawn .gy { animation: growY var(--d-slow) var(--ease-out) both; transform-origin: bottom; }

  /* week strip */
  .strip { display: flex; align-items: flex-end; gap: 6px; height: 76px; }
  .strip .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .strip .stack { position: relative; width: 12px; border-radius: var(--r-1); background: var(--ground-3); }
  .strip .stack i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: var(--r-1); background: var(--gold); transform: scaleY(0); transform-origin: bottom; transition: transform var(--d-slow) var(--ease-out); }
  .strip .col.today .stack { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .strip .col.missed .stack::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--crit); border-radius: 2px; }

  /* 11-week block bar */
  .weeks { display: flex; gap: 6px; }
  .weeks i { flex: 1; height: 8px; border-radius: 4px; background: var(--ground-3); }
  .weeks i.done { background: var(--gold); }
  .weeks i.now { box-shadow: inset 0 0 0 1.5px var(--ink); }

  /* contributors */
  .contrib { padding: 12px 0; border-top: 1px solid var(--line); }
  .contrib:first-child { border-top: 0; }
  .contrib .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .contrib .verdict { font: 500 var(--t-sub) var(--f-ui); }
  .contrib .track { position: relative; height: 2px; background: var(--ink-4); margin-top: 9px; border-radius: 2px; }
  .contrib .track .tick { position: absolute; top: -3px; width: 1px; height: 8px; background: var(--line-strong); }
  .contrib .track .mk { position: absolute; top: -2px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); transform: translateX(-3px); transition: left var(--d-slow) var(--ease-out); }

  /* scales: the only touchable surfaces */
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 12px; }
  .scale button { position: relative; min-height: 56px; border-radius: var(--r-2); background: var(--ground-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform var(--d-tap), background var(--d-fast), color var(--d-fast); }
  .scale button:active { transform: scale(.97); background: var(--ground-3); }
  .scale button .n { font: 600 var(--t-3)/1 var(--f-ui); font-variant-numeric: tabular-nums; }
  .scale button .w { font: 500 11px/1 var(--f-mono); letter-spacing: .03em; text-transform: uppercase; color: var(--ink-3); }
  .scale button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .scale button[aria-pressed="true"] .w { color: var(--ground); opacity: .7; }
  .scale button.planned::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 6px; height: 2px; border-radius: 2px; background: var(--gold-40); }

  .note-field { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; }
  textarea, input[type="number"], input[type="date"], input[type="text"], input[type="password"] {
    width: 100%; min-height: var(--hit); padding: 11px 12px; border: 0; border-radius: var(--r-2);
    background: var(--ground-2); color: var(--ink); font: 400 var(--t-body) var(--f-ui); resize: vertical; }
  textarea { min-height: 52px; }
  .ghost { min-height: var(--hit); padding: 0 16px; border-radius: var(--r-2); background: var(--ground-2); font: 600 var(--t-sub) var(--f-ui);
    transition: transform var(--d-tap), background var(--d-fast); }
  .ghost:active { transform: scale(.97); background: var(--ground-3); }
  .ghost.wide { width: 100%; }
  .linkish { font: 500 var(--t-sub) var(--f-ui); color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }

  /* sheet */
  dialog { width: 100%; max-width: 100%; margin: auto 0 0; padding: 22px var(--gutter) calc(24px + env(safe-area-inset-bottom));
    border: 0; border-radius: var(--r-3) var(--r-3) 0 0; background: var(--ground-2); color: var(--ink); }
  dialog::backdrop { background: rgba(4,7,16,.6); }
  dialog h2 { font: 600 var(--t-2)/1.2 var(--f-ui); letter-spacing: -.02em; }
  dialog .close { width: var(--hit); height: var(--hit); border-radius: var(--r-2); background: var(--ground-3); font-size: 20px; }
  dialog .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  dialog .stack { display: grid; gap: 10px; }
  @media (min-width: 600px) { dialog { margin: auto; max-width: 420px; border-radius: var(--r-3); } }
  @media (prefers-reduced-motion: no-preference) {
    dialog[open] { animation: sheetIn 320ms var(--ease-out); }
    @keyframes sheetIn { from { transform: translateY(100%); } }
  }

  /* entrance: once per view */
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
  .view.fresh > section { animation: enter var(--d-slow) var(--ease-out) both; animation-delay: calc(var(--i, 0) * 40ms); }

  /* skeleton instead of a boot screen */
  .skel { display: grid; gap: 14px; padding-top: 24px; }
  .skel i { display: block; height: 14px; border-radius: 7px; background: var(--ink-4); animation: breathe 1.2s var(--ease-io) infinite alternate; }
  .skel i.big { height: 58px; border-radius: var(--r-2); }
  .skel i.mid { height: 26px; width: 60%; }
  @keyframes breathe { from { opacity: .45; } to { opacity: .9; } }

  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px); z-index: 40;
    opacity: 0; pointer-events: none; background: var(--ink); color: var(--ground); font: 600 var(--t-sub) var(--f-ui);
    padding: 10px 16px; border-radius: 999px; transition: opacity var(--d-base), transform var(--d-base) var(--ease-out); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  .connect { max-width: 400px; margin: 0 auto; padding: 56px var(--gutter); }
  .connect img.mark { width: 52px; height: 52px; border-radius: 14px; margin-bottom: 20px; }
  .connect h1 { font: 400 44px/.95 var(--f-hero); text-transform: uppercase; margin: 6px 0 12px; }
  .connect label { display: block; margin-top: 12px; }
  .connect label span { display: block; margin-bottom: 6px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="connect-view" class="connect" hidden>
  <img class="mark" src="/static/logo.svg" alt="">
  <div class="mono">Bangsaen Marathon &middot; 15 Nov 2026</div>
  <h1>Connect Garmin</h1>
  <p class="sub" id="connect-msg">Sign in once. It reconnects on its own after that.</p>
  <p class="sub crit" id="connect-error" hidden></p>
  <p class="sub" id="connect-busy" hidden>Signing in&hellip;</p>
  <button class="ghost wide" id="owner-btn" style="margin-top:18px;">Owner sign-in</button>
  <form id="login-form" hidden>
    <label><span class="mono">Garmin email</span><input id="email" type="text" autocomplete="username"></label>
    <label><span class="mono">Password</span><input id="password" type="password" autocomplete="current-password"></label>
    <button class="ghost wide" id="login-btn" type="submit" style="margin-top:14px;">Sign in</button>
  </form>
  <form id="mfa-form" hidden>
    <label><span class="mono">MFA code</span><input id="mfa" type="text" inputmode="numeric" autocomplete="one-time-code"></label>
    <button class="ghost wide" type="submit" style="margin-top:14px;">Confirm</button>
  </form>
</div>

<div id="app-view" hidden>
  <header class="bar">
    <img src="/static/logo-small.svg" alt="">
    <div class="who"><span class="wk" id="hdr-week">&nbsp;</span><span class="mono" id="hdr-phase"></span></div>
    <button class="icon" id="refresh-btn" aria-label="Refresh from Garmin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="icon" id="settings-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0a1.7 1.7 0 0 0-2.8-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4a1.7 1.7 0 0 0 1.5-2.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4V3a2 2 0 1 1 4 0a1.7 1.7 0 0 0 2.6 1.5l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11h0a2 2 0 1 1 0 4h0a1.7 1.7 0 0 0-1.6 1z"/></svg>
    </button>
  </header>

  <main>
    <section class="view" id="view-now" role="tabpanel">
      <div class="skel" id="now-skel"><i class="mid"></i><i class="big"></i><i></i><i></i></div>
      <div id="now-body" hidden>
        <section id="s-status" style="--i:0"></section>
        <section id="s-hero" style="--i:1"></section>
        <section id="s-week" style="--i:2"></section>
        <section id="s-block" style="--i:3"></section>
        <section id="s-ribbon" style="--i:4"></section>
        <section id="s-outlook" style="--i:5"></section>
      </div>
    </section>

    <section class="view" id="view-plan" role="tabpanel" hidden>
      <div class="skel" id="plan-skel"><i class="mid"></i><i class="big"></i><i></i></div>
      <div id="plan-body" hidden>
        <section id="s-fuel" style="--i:0"></section>
        <section id="s-progression" style="--i:1"></section>
        <section id="s-timeline" style="--i:2"></section>
        <section id="s-race" style="--i:3"></section>
        <section id="s-shoes" style="--i:4"></section>
      </div>
    </section>

    <section class="view" id="view-body" role="tabpanel" hidden>
      <div class="skel" id="body-skel"><i class="mid"></i><i class="big"></i><i></i></div>
      <div id="body-body" hidden>
        <section id="s-checkin" style="--i:0"></section>
        <section id="s-stress" style="--i:1"></section>
        <section id="s-sleep" style="--i:2"></section>
        <section id="s-weight" style="--i:3"></section>
      </div>
    </section>
  </main>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="now" aria-selected="true">Now</button>
    <button role="tab" data-tab="plan" aria-selected="false">Plan</button>
    <button role="tab" data-tab="body" aria-selected="false">Body</button>
    <span class="slider" id="nav-slider"></span>
  </nav>
</div>

<dialog id="sheet"><div class="head"><h2 id="sheet-title">&nbsp;</h2><button class="close" id="sheet-close" aria-label="Close">&times;</button></div><div id="sheet-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- plumbing ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = {};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

async function getJSON(u) { const r = await fetch(u); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || r.status); return d; }
async function postJSON(u, b) {
  const r = await fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || r.status); return d;
}
const toSec = (p) => { const [m, s] = String(p).split(':').map(Number); return m * 60 + s; };
const fmtPace = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const fmtHMS = (s) => `${Math.floor(s / 3600)}:${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const km1 = (k) => (k == null ? '–' : (Math.round(k * 10) / 10).toString());
const mins = (m) => (m >= 60 ? `${Math.floor(m / 60)}h ${String(Math.round(m % 60)).padStart(2, '0')}` : `${Math.round(m)} min`);
const d8 = (d) => new Date(`${d}T00:00:00`);
const dayDiff = (a, b) => Math.round((d8(b) - d8(a)) / 86400000);
const short = (d) => d8(d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const longDate = (d) => d8(d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

const KIND = { easy: 'Easy', long: 'Long', tempo: 'Tempo', mp: 'Marathon pace', recovery: 'Recovery' };
/* The ceilings the plan's own notes prescribe. Effort, not pace, is the instruction. */
const CEILING = { recovery: 150, easy: 155, long: 162, mp: 175, tempo: 185 };
const AEROBIC = ['easy', 'long', 'recovery'];
const PHASE = { W1: 'Base', W2: 'Build', W3: 'Build', W4: 'Cutback', W5: 'Build', W6: 'Build', W7: 'Peak', W8: 'Peak', W9: 'Taper', W10: 'Taper', W11: 'Race week' };
const FEEL = [[2, 'Very easy'], [4, 'Easy'], [6, 'Moderate'], [8, 'Hard'], [10, 'All-out']];
const PLANNED_RPE = { recovery: [2, 3], easy: [3, 4], long: [4, 5], mp: [5, 6], tempo: [7, 8] };
const MOOD = [[1, 'Rough'], [2, 'Flat'], [3, 'Fine'], [4, 'Good'], [5, 'Great']];
const MOTIV = [[1, 'Empty'], [2, 'Low'], [3, 'Steady'], [4, 'Keen'], [5, 'Fired']];

const sessionFor = (d) => (S.plan?.sessions || []).find((s) => s.date === d);
const rowFor = (d) => (S.progress?.rows || []).find((r) => r.date === d);
const feelOf = (r) => (r?.activityId ? S.feels?.[String(r.activityId)] : null) || {};
const curWeek = () => { const due = (S.progress?.rows || []).filter((r) => r.status !== 'upcoming'); return due.length ? due[due.length - 1].week : 'W1'; };
const done = (r) => r.status === 'done' || r.status === 'partial';

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200); }
function countUp(el, to, fmt = (v) => Math.round(v).toString(), ms = 600) {
  if (!el) return;
  if (reduceMotion) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / ms); el.textContent = fmt(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function safe(label, el, fn) { try { fn(); } catch (e) { console.error(label, e); el.innerHTML = `<p class="sub crit">Couldn't show ${esc(label)}: ${esc(e.message)}</p>`; } }

/* ---------- the moment ---------- */
function moment() {
  const today = S.progress.today, race = S.plan.race.date;
  if (today === race) return 'RACE';
  if (today > race) return 'AFTER_RACE';
  const r = rowFor(today);
  if (!r) return 'BROWSE';
  return done(r) ? 'AFTER' : 'BEFORE';
}

/* ---------- the band: one component, five uses ---------- */
function bandSvg(opts) {
  const { fast, slow, actual, ghost, label, inZone, h = 96, animate = true } = opts;
  const W = 350, y = 56, x0 = 16, x1 = 334;
  const pad = 45;
  let lo = Math.min(fast, actual ?? fast, ghost ?? fast) - pad;
  let hi = Math.max(slow, actual ?? slow, ghost ?? slow) + pad;
  const x = (p) => x0 + ((Math.max(lo, Math.min(hi, p)) - lo) / (hi - lo)) * (x1 - x0);
  const zx = x(fast), zw = Math.max(10, x(slow) - x(fast));
  let g = `<line class="track" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"/>
    <rect class="glow" x="${zx - 8}" y="${y - 14}" width="${zw + 16}" height="28" rx="14"/>
    <rect class="zone" x="${zx}" y="${y - 6}" width="${zw}" height="12" rx="6"/>
    <text class="ax" x="${zx}" y="${y + 24}" text-anchor="start">${esc(fmtPace(fast))}</text>
    <text class="ax" x="${zx + zw}" y="${y + 24}" text-anchor="end">${esc(fmtPace(slow))}</text>`;
  if (ghost != null && actual == null) {
    g += `<circle class="ghost" cx="${x(ghost)}" cy="${y}" r="6"/>
      <text class="ax" x="${x(ghost)}" y="${y - 16}" text-anchor="middle">last ${esc(fmtPace(ghost))}</text>`;
  }
  if (actual != null) {
    const ax = x(actual), out = !inZone;
    if (out) {
      const edge = actual < fast ? x(fast) : x(slow);
      const delta = actual < fast ? fast - actual : actual - slow;
      g += `<line class="lead-line" x1="${edge}" x2="${ax}" y1="${y}" y2="${y}"/>
        <text class="delta" x="${(edge + ax) / 2}" y="${y + 24}" text-anchor="middle">${actual < fast ? '−' : '+'}${Math.round(delta)}s</text>`;
    }
    const from = x1 - ax;
    g += `<g class="mark-g" style="--from:${from}px"><circle class="mark" cx="${ax}" cy="${y}" r="8"/>
      <text class="lbl" x="${ax}" y="${y - 20}" text-anchor="middle">${esc(label || fmtPace(actual))}</text></g>`;
  }
  const cls = `band${inZone && actual != null ? ' in' : ''}${animate && !reduceMotion ? ' anim' : ''}`;
  return `<svg class="${cls}" viewBox="0 0 ${W} ${h}" role="img" aria-label="Target band ${fmtPace(fast)} to ${fmtPace(slow)}${actual != null ? `, you ran ${fmtPace(actual)}` : ''}">${g}</svg>`;
}
/* the same idea, 4px tall, for plan rows */
function bandStrip(fast, slow, actual, inZone) {
  const W = 120, pad = 40;
  const lo = Math.min(fast, actual ?? fast) - pad, hi = Math.max(slow, actual ?? slow) + pad;
  const x = (p) => ((Math.max(lo, Math.min(hi, p)) - lo) / (hi - lo)) * W;
  return `<svg class="band" viewBox="0 0 ${W} 8" style="width:${W}px" aria-hidden="true">
    <line class="track" x1="0" x2="${W}" y1="4" y2="4"/>
    <rect class="zone" x="${x(fast)}" y="1" width="${Math.max(4, x(slow) - x(fast))}" height="6" rx="3"/>
    ${actual != null ? `<circle cx="${x(actual)}" cy="4" r="4" fill="${inZone ? 'var(--ink)' : 'var(--crit)'}" stroke="var(--ground)" stroke-width="1.5"/>` : ''}</svg>`;
}

/* ---------- NOW ---------- */
function renderStatus() {
  const r = S.readiness, flags = (S.insights || []).filter((i) => ['critical', 'warning'].includes(i.severity) && (!i.date || dayDiff(i.date, S.progress.today) <= 7));
  const order = { critical: 0, warning: 1 };
  flags.sort((a, b) => (order[a.severity] ?? 2) - (order[b.severity] ?? 2));
  const top = flags[0];
  const word = r?.available ? (r.verdict === 'green' ? 'Ready' : r.verdict === 'amber' ? 'Hold' : 'Rest') : 'No data';
  const cls = r?.verdict === 'green' ? 'good' : r?.verdict === 'red' ? 'crit' : '';
  document.documentElement.style.setProperty('--dawn-gold', r?.verdict === 'green' ? .12 : r?.verdict === 'red' ? 0 : .06);
  document.documentElement.style.setProperty('--dawn-blue', r?.verdict === 'red' ? .26 : r?.verdict === 'green' ? .22 : .18);
  $('s-status').innerHTML = `
    <button id="status-line" style="text-align:left;display:block;width:100%;">
      <span class="mono ${cls}">${esc(word)}${r?.available ? ` ${r.score}` : ''}</span>
      <span class="sub">${esc(r?.reasons?.[0] || 'Readiness needs sleep and resting-HR data.')}</span>
    </button>
    ${top ? `<p class="sub crit" style="margin-top:12px;"><b>${esc(top.title)}</b> ${esc(top.suggestion)}</p>` : ''}
    <div id="status-more" class="hide" style="margin-top:10px;"><p class="sub">${esc((r?.reasons || []).join(' '))}${r?.pivotSuggestion ? ` <b class="crit">${esc(r.pivotSuggestion)}</b>` : ''}</p></div>`;
  $('status-line').addEventListener('click', () => $('status-more').classList.toggle('hide'));
}

function ceilingFor(kind) { return CEILING[kind] ?? 160; }

function renderHero() {
  const el = $('s-hero'), m = S.moment;
  if (m === 'RACE' || m === 'AFTER_RACE') return renderRaceHero(el, m);
  const focus = m === 'BEFORE' ? S.progress.today : (m === 'AFTER' ? S.progress.today : (S.progress.rows.find((r) => r.status === 'upcoming') || {}).date);
  if (!focus) { el.innerHTML = '<p class="sub">Plan complete. The race is next.</p>'; return; }
  const s = sessionFor(focus), row = rowFor(focus), kind = s?.kind || 'easy';
  const cap = ceilingFor(kind), aerobic = AEROBIC.includes(kind);
  const shoe = (S.shoes || []).find((x) => x.role === (kind === 'mp' ? 'race' : 'training'));

  if (m === 'AFTER' && row && done(row)) {
    const f = feelOf(row), hr = row.mpEffortHr || row.actualHr, mpKm = row.mpEffortKm;
    const heldCap = hr ? hr <= cap : null;
    el.innerHTML = `
      <div class="kicker mono">Today &middot; ${esc(KIND[kind])} &middot; done ${km1(row.actualKm)} km${hr ? ` &middot; hr ${Math.round(hr)}` : ''}</div>
      <div class="hero num${heldCap === false ? '' : ' gold'}" id="hero-n">${esc(row.actualPaceLabel)}<small>/km</small></div>
      <div id="hero-band" style="margin-top:14px;"></div>
      <p class="sub" style="margin-top:10px;">${heldCap == null ? '' : heldCap
        ? `<span class="good">Held the ceiling.</span> HR ${Math.round(hr)} under ${cap}${streakText(kind)}`
        : `<span class="crit">Over the ceiling.</span> HR ${Math.round(hr)} against a ${cap} cap — that is the habit to break.`}
        ${mpKm ? ` Marathon-pace portion ${esc(row.mpEffortPaceLabel)}/km over ${km1(mpKm)} km.` : ''}</p>
      <div id="feel-slot" style="margin-top:22px;"></div>`;
    const bs = s ? { fast: toSec(s.paceHi), slow: toSec(s.paceLo), actual: row.actualPace, inZone: row.inZone, label: row.actualPaceLabel } : null;
    if (bs) $('hero-band').innerHTML = bandSvg(bs);
    renderFeel(row, f);
    return;
  }

  const prev = [...S.progress.rows].reverse().find((r) => r.kind === kind && done(r) && r.actualPace);
  el.innerHTML = `
    <div class="kicker mono">${m === 'BEFORE' ? 'Today' : short(focus)} &middot; ${esc(KIND[kind])} &middot; ${km1(s.km)} km &middot; ${esc(mins(s.durationMin))}${shoe ? ` &middot; ${esc(shoe.name)}` : ''}</div>
    ${aerobic
      ? `<div class="hero num gold">HR &le; ${cap}</div>
         <p class="sub" style="margin-top:8px;">Effort is the instruction. That usually lands near ${esc(s.paceHi)}–${esc(s.paceLo)}/km, and slower is fine.</p>`
      : `<div class="hero num gold">${esc(s.paceHi)}–${esc(s.paceLo)}<small>/km</small></div>
         <p class="sub" style="margin-top:8px;">Start at the slow end. Keep HR under ${cap}.</p>`}
    <div id="hero-band" style="margin-top:16px;"></div>
    ${s.steps.length > 1 ? `<div style="margin-top:18px;">${s.steps.map(stepRow).join('')}</div>` : ''}
    <div class="why"><img src="/static/logo-small.svg" alt=""><p>${cue(kind, prev, cap)}</p></div>
    ${s.note ? `<button class="linkish" id="note-more" style="margin-top:12px;">Why this session</button><p class="sub hide" id="note-body" style="margin-top:8px;">${esc(s.note)}</p>` : ''}`;
  $('hero-band').innerHTML = bandSvg({ fast: toSec(s.paceHi), slow: toSec(s.paceLo), ghost: prev?.actualPace });
  if ($('note-more')) $('note-more').addEventListener('click', () => { $('note-body').classList.toggle('hide'); });
}

function streakText(kind) {
  const rows = S.progress.rows.filter((r) => AEROBIC.includes(r.kind) && done(r) && r.actualHr);
  let n = 0;
  for (const r of [...rows].reverse()) { if (r.actualHr <= ceilingFor(r.kind)) n++; else break; }
  return n > 1 ? ` — ${n} in a row.` : '.';
}

function stepRow(st) {
  const band = st.paceFast && st.paceSlow ? `${st.paceFast}–${st.paceSlow}` : '';
  const name = st.role === 'repeat' ? `${st.reps}×${km1(st.km)} km ${KIND[st.kind].toLowerCase()}`
    : st.role === 'warmup' ? `${km1(st.km)} km warm-up` : st.role === 'cooldown' ? `${km1(st.km)} km cool-down` : `${km1(st.km)} km ${KIND[st.kind].toLowerCase()}`;
  return `<div class="row"><div class="grow"><div class="sub">${esc(name)}${st.recoveryKm ? ` &middot; ${km1(st.recoveryKm)} km jog between` : ''}</div></div><div class="val">${esc(band)}</div></div>`;
}

function cue(kind, prev, cap) {
  if (!prev) return `First ${esc(KIND[kind].toLowerCase())} of the block. Set the pattern: start at the slow end.`;
  const f = feelOf(prev), hr = prev.mpEffortHr || prev.actualHr;
  const over = hr && hr > cap;
  let t = `Last ${esc(KIND[kind].toLowerCase())} ran <b>${esc(prev.actualPaceLabel)}</b>`;
  t += hr ? ` at HR ${Math.round(hr)}` : '';
  t += over ? ` — over the ${cap} ceiling. Today, hold it down.` : ` — inside the ceiling. Same again.`;
  if (f.rpe) t += ` You called it ${f.rpe}/10.`;
  return t;
}

function renderRaceHero(el, m) {
  const race = S.plan.race, days = dayDiff(S.progress.today, race.date);
  const first5 = S.racePlan?.pacing?.segments?.[0];
  if (m === 'AFTER_RACE') {
    el.innerHTML = `<div class="kicker mono">Bangsaen done</div>
      <div class="hero">Finished</div>
      <p class="sub" style="margin-top:10px;">Three years of this is in the legs. Log how it felt while it is fresh.</p>`;
    return;
  }
  el.innerHTML = `<div class="kicker mono">Race day &middot; ${days === 0 ? 'today' : `${days} days`} &middot; goal ${esc(race.stretch_time)}</div>
    <div class="hero num gold">${esc(first5 ? first5.paceLabel : '5:50')}<small>/km</small></div>
    <p class="sub" style="margin-top:8px;">First 5 km only. Deliberately slower than goal pace.</p>
    <div class="why"><img src="/static/logo-small.svg" alt=""><p>Hold this while everyone passes you. <b>2024 and 2025 were both lost in the first hour</b>, not the last.</p></div>`;
}

function renderFeel(row, f) {
  const [lo, hi] = PLANNED_RPE[row.kind] || [3, 5];
  const slot = $('feel-slot');
  slot.innerHTML = `<div class="mono">How hard was it?</div>
    <div class="scale" id="rpe">${FEEL.map(([v, w]) => `<button type="button" data-v="${v}" aria-pressed="${f.rpe === v}" class="${v >= lo && v <= hi + 1 ? 'planned' : ''}"><span class="n">${v}</span><span class="w">${esc(w)}</span></button>`).join('')}</div>
    ${f.rpe ? `<p class="sub" style="margin-top:10px;">${f.rpe > hi + 1 ? '<span class="crit">Harder than it should have been.</span>' : 'About right for this session.'}</p>` : ''}
    <div class="note-field">
      <textarea id="feel-note" maxlength="500" placeholder="In your own words…">${esc(f.note || '')}</textarea>
      ${window.webkitSpeechRecognition || window.SpeechRecognition ? '<button class="ghost" id="dictate" aria-label="Dictate">🎙</button>' : ''}
    </div>`;
  const save = async (rpe, note) => {
    try {
      await postJSON('/api/feel', { activityId: row.activityId, date: row.actualDate || row.date, rpe, note });
      S.feels = { ...(S.feels || {}), [String(row.activityId)]: { rpe, date: row.actualDate || row.date, note } };
      toast(note ? 'Saved' : `Felt ${rpe}/10`);
      renderHero(); renderWeek();
    } catch (e) { toast(e.message); }
  };
  slot.querySelectorAll('#rpe button').forEach((b) => b.addEventListener('click', () => save(Number(b.dataset.v), $('feel-note').value)));
  $('feel-note').addEventListener('blur', () => {
    const cur = feelOf(row);
    if (!cur.rpe || $('feel-note').value === (cur.note || '')) return;
    save(cur.rpe, $('feel-note').value);
  });
  if ($('dictate')) $('dictate').addEventListener('click', () => {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new R(); rec.lang = 'en-IN'; rec.interimResults = false;
    rec.onresult = (e) => { $('feel-note').value = `${$('feel-note').value} ${e.results[0][0].transcript}`.trim(); $('feel-note').dispatchEvent(new Event('blur')); };
    rec.start(); toast('Listening…');
  });
}

function renderWeek() {
  const wk = curWeek(), rows = S.progress.rows.filter((r) => r.week === wk);
  const planned = rows.reduce((a, r) => a + r.plannedKm, 0), actual = rows.reduce((a, r) => a + (r.actualKm || 0), 0);
  const maxKm = Math.max(...rows.map((r) => Math.max(r.plannedKm, r.actualKm || 0)), 1);
  const DAYS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  const monday = (() => { const d = d8(S.progress.today); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return d; })();
  const cols = DAYS.map((dd, i) => {
    const date = new Date(monday); date.setDate(date.getDate() + i);
    const iso = date.toISOString().slice(0, 10), r = rows.find((x) => x.date === iso);
    const h = r ? Math.max(8, (Math.max(r.plannedKm, r.actualKm || 0) / maxKm) * 64) : 3;
    const fill = r && r.actualKm ? Math.min(1, r.actualKm / Math.max(r.plannedKm, r.actualKm)) : 0;
    const cls = [iso === S.progress.today ? 'today' : '', r && r.status === 'missed' ? 'missed' : ''].join(' ');
    return `<div class="col ${cls}"><div class="stack" style="height:${h}px"><i data-fill="${fill}"></i></div><span class="mono">${dd}</span></div>`;
  }).join('');
  $('s-week').innerHTML = `<div class="strip">${cols}</div>
    <p class="mono" style="margin-top:12px;">${km1(actual)} / ${km1(planned)} km &middot; ${rows.filter(done).length} of ${rows.length} runs</p>`;
  requestAnimationFrame(() => $('s-week').querySelectorAll('.stack i').forEach((i) => { i.style.transform = `scaleY(${i.dataset.fill})`; }));
}

function renderBlock() {
  const rows = S.progress.rows, wk = curWeek(), weekNo = Number(wk.replace('W', '')) || 1;
  const byWeek = {};
  rows.forEach((r) => { (byWeek[r.week] = byWeek[r.week] || []).push(r); });
  const weeks = Object.keys(byWeek);
  const kmDone = rows.reduce((a, r) => a + (r.actualKm || 0), 0), kmAll = rows.reduce((a, r) => a + r.plannedKm, 0);
  const due = rows.filter((r) => r.status !== 'upcoming' && r.status !== 'today');
  const bars = weeks.map((w) => {
    const ws = byWeek[w], p = ws.reduce((a, r) => a + r.plannedKm, 0), a = ws.reduce((x, r) => x + (r.actualKm || 0), 0);
    const cls = a >= p * .9 ? 'done' : '';
    return `<i class="${cls} ${w === wk ? 'now' : ''}"></i>`;
  }).join('');

  const longs = rows.filter((r) => r.kind === 'long');
  const longestDone = Math.max(0, ...longs.filter((r) => r.actualKm).map((r) => r.actualKm));
  const longestDue = Math.max(0, ...longs.filter((r) => r.status !== 'upcoming').map((r) => r.plannedKm));
  const mpKmOf = (d) => (sessionFor(d)?.steps || []).reduce((a, st) => a + (st.kind === 'mp' ? (st.reps || 1) * st.km : 0), 0);
  const mpDone = rows.reduce((a, r) => a + (r.mpEffortKm || 0), 0), mpDue = due.reduce((a, r) => a + mpKmOf(r.date), 0);
  const items = [
    ['Sessions', due.filter(done).length, due.length, 'runs'],
    ['Distance', Math.round(kmDone), Math.round(due.reduce((a, r) => a + r.plannedKm, 0)), 'km'],
    ['Long run', longestDone, longestDue, 'km'],
    ['Marathon pace', Math.round(mpDone), Math.round(mpDue), 'km'],
  ];
  $('s-block').innerHTML = `<div class="weeks">${bars}</div>
    <p class="mono" style="margin-top:12px;">Week ${weekNo} of 11 &middot; ${dayDiff(S.progress.today, S.plan.race.date)} days &middot; ${km1(kmDone)} / ${km1(kmAll)} km</p>
    <div style="margin-top:18px;">${items.map(([label, got, need, unit]) => {
      const pct = need > 0 ? Math.min(100, (100 * got) / need) : 0;
      const v = pct >= 90 ? ['On track', ''] : pct >= 75 ? ['Close', 'dim'] : ['Behind', 'crit'];
      return `<div class="contrib"><div class="top"><span class="sub">${esc(label)}</span><span class="verdict ${v[1]}">${v[0]}</span></div>
        <div class="track"><span class="tick" style="left:95%"></span><span class="mk" style="left:${pct}%"></span></div>
        <p class="mono" style="margin-top:7px;">${got} of ${need} ${unit}</p></div>`;
    }).join('')}</div>`;
}

/* pace vs target, normalised so the band is always the ribbon */
function ribbonChart() {
  const runs = S.progress.rows.filter((r) => done(r) && r.actualPace && sessionFor(r.date)).slice(-10);
  const el = $('s-ribbon');
  if (!runs.length) { el.innerHTML = '<p class="sub">No runs yet.</p>'; return; }
  const W = 350, H = 120, mid = 58, half = 28;
  const pts = runs.map((r, i) => {
    const s = sessionFor(r.date), fast = toSec(s.paceHi), slow = toSec(s.paceLo);
    const centre = (fast + slow) / 2, width = Math.max(4, (slow - fast) / 2);
    const norm = Math.max(-4, Math.min(4, (r.actualPace - centre) / width));
    const hr = r.mpEffortHr || r.actualHr;
    return { x: 24 + (i * (W - 48)) / Math.max(1, runs.length - 1), y: mid + norm * (half / 1), r, hot: hr && hr > ceilingFor(r.kind), inZone: r.inZone };
  });
  const dots = pts.map((p) => {
    const rad = p.r.kind === 'long' ? 6 : ['mp', 'tempo'].includes(p.r.kind) ? 7 : 4;
    const fill = p.inZone ? 'var(--gold)' : 'none';
    return `${p.hot ? `<circle cx="${p.x}" cy="${p.y}" r="${rad + 4}" fill="none" stroke="var(--crit)" stroke-width="1.5" opacity=".7"/>` : ''}
      <circle cx="${p.x}" cy="${p.y}" r="${rad}" fill="${fill}" ${p.inZone ? '' : 'stroke="var(--crit)" stroke-width="1.5"'}/>`;
  }).join('');
  const last = pts[pts.length - 1];
  el.innerHTML = `<div class="mono">In the band &middot; last ${runs.length} runs</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Each run against its target band">
      <rect class="ribbon" x="12" y="${mid - half / 2}" width="${W - 24}" height="${half}" rx="6"/>
      <text class="ax" x="12" y="${mid - half / 2 - 8}">fast</text>
      <text class="ax" x="12" y="${mid + half / 2 + 16}">slow</text>
      ${dots}
      <text class="now" x="${last.x}" y="${last.y - 14}" text-anchor="middle">${esc(last.r.actualPaceLabel)}</text>
    </svg>`;
}

function renderOutlook() {
  const p = S.progress.prediction, ff = p?.fadeForecast, el = $('s-outlook');
  if (!p?.available) { el.innerHTML = `<div class="mono">Outlook</div><p class="sub" style="margin-top:8px;">${esc(p?.message || '')}</p>`; return; }
  const longestMp = Math.max(0, ...S.progress.rows.map((r) => r.mpEffortKm || 0));
  const best = S.progress.rows.filter((r) => r.mpEffortKm).slice(-1)[0];
  el.innerHTML = `<div class="mono">If today's pattern holds</div>
    <div class="second num gold" id="fade-n">${esc(ff?.available ? ff.forecastFinishLabel : p.avgPredictedLabel)}</div>
    <p class="sub" style="margin-top:8px;">${esc(ff?.available ? ff.message : p.message)}</p>
    <div style="margin-top:16px;">

      <div class="row"><div class="grow"><div class="sub">Longest marathon-pace block held</div><div class="meta mono">${best ? `${esc(best.mpEffortPaceLabel)}/km${best.mpEffortHr ? ` at hr ${Math.round(best.mpEffortHr)}` : ''}` : 'none yet'}</div></div><div class="val">${km1(longestMp)} km</div></div>
      <div class="row"><div class="grow"><div class="sub">Goal</div><div class="meta mono">${esc(S.plan.race.stretch_pace)} for 42.195 km</div></div><div class="val">${esc(S.plan.race.stretch_time)}</div></div>

  el.innerHTML = `<div class="mono">Fuel today &middot; ${esc(f.dayType || '')} &middot; ${km1(f.weightKg)} kg</div>
    <div style="display:flex;gap:22px;margin-top:14px;">${trio.map(([v, u]) => `<div><div class="num" style="font:600 var(--t-2)/1 var(--f-ui);letter-spacing:-.02em;">${esc(v)}</div><div class="mono" style="margin-top:4px;">${esc(u)}</div></div>`).join('')}</div>
    <div class="contrib" style="border:0;padding-top:16px;"><div class="track"><span class="mk" style="left:${waterPct}%"></span></div></div>

      ${d ? `<div class="row"><div class="grow"><div class="mono">During</div><p class="sub" style="margin-top:4px;">${esc(d.text)}${d.fluidMlPerHour ? ` Fluid ${d.fluidMlPerHour[0]}–${d.fluidMlPerHour[1]} ml/h${d.sodiumMgPerHour ? `, sodium ${d.sodiumMgPerHour[0]}–${d.sodiumMgPerHour[1]} mg/h` : ''}.` : ''}</p></div></div>` : ''}

function progressionChart() {
  const rows = S.progress.rows, byWeek = {};
  rows.forEach((r) => { (byWeek[r.week] = byWeek[r.week] || []).push(r); });
  const weeks = Object.keys(byWeek), wk = curWeek();
  const W = 350, H = 96, bw = 22, gap = (W - weeks.length * bw) / (weeks.length - 1);
  const maxKm = Math.max(...weeks.map((w) => byWeek[w].reduce((a, r) => a + r.plannedKm, 0)));
  const bars = weeks.map((w, i) => {
    const ws = byWeek[w], p = ws.reduce((a, r) => a + r.plannedKm, 0), a = ws.reduce((x, r) => x + (r.actualKm || 0), 0);
    const x = i * (bw + gap), h = (p / maxKm) * 72, y = 80 - h, ah = Math.min(h, (a / maxKm) * 72);
    const future = ws.every((r) => r.status === 'upcoming');
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="var(--ground-3)" opacity="${future ? .6 : 1}"/>
      ${ah > 0 ? `<rect class="gy" x="${x}" y="${80 - ah}" width="${bw}" height="${ah}" rx="6" fill="var(--gold)"/>` : ''}
      ${w === wk ? `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="none" stroke="var(--ink)" stroke-width="1.5"/>` : ''}`;
  }).join('');
  $('s-progression').innerHTML = `<div class="mono">The block &middot; weekly km</div>
    <svg class="chart drawn" viewBox="0 0 ${W} ${H}" role="img" aria-label="Planned and completed distance for each of the 11 weeks">
      ${bars}<circle cx="${(weeks.length - 1) * (bw + gap) + bw / 2}" cy="12" r="5" fill="var(--gold)"/>
      <text class="ax" x="0" y="${H - 2}">W1</text><text class="ax" x="${W}" y="${H - 2}" text-anchor="end">Race</text>
    </svg>`;
}

function renderTimeline() {
  const rows = S.progress.rows, byWeek = {}, wk = curWeek();
  rows.forEach((r) => { (byWeek[r.week] = byWeek[r.week] || []).push(r); });
  $('s-timeline').innerHTML = `<div class="mono">Plan</div><div style="margin-top:12px;">${Object.keys(byWeek).map((w) => {
    const ws = byWeek[w], p = ws.reduce((a, r) => a + r.plannedKm, 0), a = ws.reduce((x, r) => x + (r.actualKm || 0), 0);
    const future = ws.every((r) => r.status === 'upcoming'), open = w === wk;
    return `<div class="row"><div class="grow"><div class="lead" style="font-family:var(--f-hero);font-weight:400;">${esc(w)}</div>
        <div class="meta mono">${esc(PHASE[w] || '')} &middot; ${future ? `${ws.length} runs` : `${ws.filter(done).length} of ${ws.length} done`}</div></div>
      <div class="val">${future ? `${km1(p)} km` : `${km1(a)} / ${km1(p)} km`}</div></div>
      ${open ? ws.map((r) => {
        const s = sessionFor(r.date) || {}, f = feelOf(r);
        return `<div class="row" style="padding-left:14px;"><div class="grow">
          <div class="sub">${esc(r.label)}</div>
          <div class="meta mono">${esc(short(r.date))}${r.actualKm ? ` &middot; ran ${km1(r.actualKm)} km at ${esc(r.actualPaceLabel)}` : ` &middot; ${km1(r.plannedKm)} km`}${f.rpe ? ` &middot; felt ${f.rpe}/10` : ''}</div>
          ${f.note ? `<p class="sub" style="margin-top:6px;color:var(--ink-3);font-style:italic;">&ldquo;${esc(f.note)}&rdquo;</p>` : ''}</div>
          <div>${s.paceHi ? bandStrip(toSec(s.paceHi), toSec(s.paceLo), r.actualPace ?? null, r.inZone) : ''}</div></div>`;
      }).join('') : ''}`;
  }).join('')}</div>`;
}

function renderRace() {
  const rp = S.racePlan, el = $('s-race');
  if (!rp) { el.innerHTML = '<p class="sub">Race plan unavailable.</p>'; return; }
  const p = rp.pacing, f = rp.fuel, W = 350, H = 112;
  const paces = p.segments.map((s) => toSec(s.paceLabel));
  const lo = Math.min(...paces) - 12, hi = Math.max(...paces) + 12;
  const x = (km) => (km / 42.195) * W, y = (pc) => 20 + ((pc - lo) / (hi - lo)) * 56;
  const steps = p.segments.map((s) => `M${x(s.fromKm)},${y(toSec(s.paceLabel))} L${x(s.toKm)},${y(toSec(s.paceLabel))}`).join(' ');
  const gels = (f.gels || []).map((g) => `<line x1="${x(g.km)}" x2="${x(g.km)}" y1="84" y2="92" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>`).join('');
  el.innerHTML = `<div class="mono">Race day &middot; goal ${esc(p.goalLabel)} &middot; ${esc(p.goalPaceLabel)}/km</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Race pace plan by kilometre with gel timings">
      <path d="${steps}" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linejoin="round"/>
      <line class="ref" x1="${x(21.1)}" x2="${x(21.1)}" y1="14" y2="80"/>
      <text class="ax" x="${x(21.1)}" y="10" text-anchor="middle">half ${esc(p.halfwayLabel)}</text>
      ${gels}<text class="ax" x="0" y="${H - 2}">${esc(f.gelCount)} gels</text>
      <text class="ax" x="${W}" y="${H - 2}" text-anchor="end">42.2 km</text>
    </svg>
    <div style="margin-top:14px;">${p.segments.map((s) => `<div class="row"><div class="grow"><div class="sub">${km1(s.fromKm)}–${km1(s.toKm)} km</div><div class="meta mono">by ${esc(s.elapsedAtEndLabel)}</div></div><div class="val">${esc(s.paceLabel)}/km</div></div>`).join('')}</div>
    <button class="linkish" id="race-more" style="margin-top:12px;">Fuel, race morning and carb load</button>
    <div class="hide" id="race-detail" style="margin-top:12px;">
      <p class="sub">${esc(f.fluidNote || '')} Carbs ${f.carbsPerHour?.[0]}–${f.carbsPerHour?.[1]} g/h, fluid ${f.fluidMlPerHour?.[0]}–${f.fluidMlPerHour?.[1]} ml/h.</p>
      <p class="sub" style="margin-top:10px;">${esc(rp.raceMorning?.text || '')}</p>
      <p class="sub" style="margin-top:10px;">${esc(rp.carbLoad?.text || '')}</p>
    </div>`;
  $('race-more').addEventListener('click', () => $('race-detail').classList.toggle('hide'));
}

function renderCheckin() {
  const m = S.mind, today = m.today, cur = (m.checkins || {})[today] || {}, sum = m.checkinSummary || {};
  $('s-checkin').innerHTML = `<div class="mono">${esc(longDate(today))}${sum.streak ? ` &middot; day ${sum.streak}` : ''}</div>
    ${m.checkinError ? `<p class="sub crit" style="margin-top:10px;">${esc(m.checkinError)}</p>` : ''}
    <div class="mono" style="margin-top:16px;">Mood</div>
    <div class="scale" id="ci-mood">${MOOD.map(([v, w]) => `<button type="button" data-v="${v}" aria-pressed="${cur.mood === v}"><span class="w">${esc(w)}</span></button>`).join('')}</div>
    <div class="mono" style="margin-top:16px;">Motivation</div>
    <div class="scale" id="ci-motiv">${MOTIV.map(([v, w]) => `<button type="button" data-v="${v}" aria-pressed="${cur.motivation === v}"><span class="w">${esc(w)}</span></button>`).join('')}</div>
    <div class="note-field"><textarea id="ci-note" maxlength="280" placeholder="Anything worth remembering…">${esc(cur.note || '')}</textarea></div>`;
  let mood = cur.mood || null, motiv = cur.motivation || null;
  const save = async () => {
    if (!mood || !motiv) return;
    try {
      await postJSON('/api/checkin', { date: today, mood, motivation: motiv, note: $('ci-note').value });
      S.mind.checkins = { ...(S.mind.checkins || {}), [today]: { mood, motivation: motiv, note: $('ci-note').value } };
      toast('Check-in saved');
    } catch (e) { toast(e.message); }
  };
  const wire = (id, set) => $(id).querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
    $(id).querySelectorAll('button').forEach((o) => o.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true'); set(Number(b.dataset.v)); save();
  }));
  wire('ci-mood', (v) => { mood = v; });
  wire('ci-motiv', (v) => { motiv = v; });
  $('ci-note').addEventListener('blur', save);
}

function renderStress() {
  const st = S.mind.stress, days = S.mind.stressDays || [], el = $('s-stress');
  if (!st?.available || !days.length) { el.innerHTML = `<div class="mono">Stress</div><p class="sub" style="margin-top:8px;">${esc(st?.message || 'No stress data.')}</p>`; return; }
  const W = 350, H = 112, base = st.baselineAvg;
  const hi = Math.max(60, ...days.map((d) => d.avg)) * 1.1;
  const y = (v) => 88 - (v / hi) * 68;
  const runDates = new Set(S.progress?.rows?.filter((r) => r.actualKm).map((r) => r.actualDate || r.date) || []);
  const marks = days.map((d, i) => {
    const x = 16 + (i * (W - 40)) / Math.max(1, days.length - 1);
    const run = runDates.has(d.date), last = i === days.length - 1;
    const hot = base && d.avg > base + 10;
    return `<line x1="${x}" x2="${x}" y1="${y(base || d.avg)}" y2="${y(d.avg)}" stroke="${hot ? 'var(--crit)' : 'var(--ink-4)'}" stroke-width="1" opacity=".6"/>
      <circle cx="${x}" cy="${y(d.avg)}" r="${last ? 5 : 4}" fill="${last ? 'var(--ink)' : run ? 'none' : 'var(--ink-2)'}" ${run && !last ? 'stroke="var(--ink-2)" stroke-width="1.5"' : ''}/>
      ${last ? `<text class="now" x="${x}" y="${y(d.avg) - 12}" text-anchor="end">${d.avg}</text>` : ''}`;
  }).join('');
  const word = st.verdict === 'elevated' ? 'elevated' : st.verdict === 'low' ? 'calm' : 'steady';
  el.innerHTML = `<div class="mono">Stress &middot; ${esc(word)}</div>
    <div class="second num" style="margin-top:8px;">${st.latest.avg}</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily stress against your baseline">
      ${base ? `<line class="ref" x1="12" x2="${W - 12}" y1="${y(base)}" y2="${y(base)}"/><text class="ax" x="12" y="${y(base) - 6}">your normal ${base}</text>` : ''}
      ${marks}
      <text class="ax" x="12" y="${H - 2}">${esc(days[0].date.slice(8))}/${esc(days[0].date.slice(5, 7))}</text>
      <text class="ax" x="${W - 12}" y="${H - 2}" text-anchor="end">yesterday</text>
    </svg>`;
}

function renderSleep() {
  const sl = S.mind.sleep || {}, sm = sl.summary || {}, nights = (sl.entries || []).slice(-10), el = $('s-sleep');
  if (!nights.length) { el.innerHTML = '<div class="mono">Sleep</div><p class="sub" style="margin-top:8px;">No sleep data.</p>'; return; }
  const W = 350, H = 96, bw = 6;
  const gap = (W - 24 - nights.length * bw) / Math.max(1, nights.length - 1);
  const y = (h) => 78 - (h / 10) * 62;
  const bars = nights.map((n, i) => {
    const x = 12 + i * (bw + gap), last = i === nights.length - 1;
    const c = last ? 'var(--ink)' : n.hours >= 7 ? 'var(--ink-2)' : n.hours >= 6 ? 'var(--ink-3)' : 'var(--crit)';
    return `<rect class="gy" x="${x}" y="${y(n.hours)}" width="${bw}" height="${78 - y(n.hours)}" rx="3" fill="${c}"/>
      ${last ? `<text class="now" x="${x + bw / 2}" y="${y(n.hours) - 8}" text-anchor="middle">${n.hours}</text>` : ''}`;
  }).join('');
  el.innerHTML = `<div class="mono">Sleep &middot; avg ${sm.avgHours ?? '–'}h over ${sm.nightsLogged ?? nights.length} nights</div>
    <div class="second num" style="margin-top:8px;">${sm.latestHours ?? '–'}<small style="font:400 16px var(--f-ui);color:var(--ink-2);">h</small></div>
    <svg class="chart drawn" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hours slept per night">
      <line class="ref" x1="12" x2="${W - 12}" y1="${y(7)}" y2="${y(7)}"/><text class="ax" x="${W - 12}" y="${y(7) - 6}" text-anchor="end">7h</text>
      ${bars}</svg>`;
}

function renderWeightRow() {
  const w = S.weight, t = w?.trend || {}, e = w?.entries || [], el = $('s-weight');
  const spark = (() => {
    if (e.length < 2) return '';
    const vals = e.slice(-10).map((x) => x.weightKg), lo = Math.min(...vals) - .2, hi = Math.max(...vals) + .2;
    const pts = vals.map((v, i) => `${(i * 100) / (vals.length - 1)},${20 - ((v - lo) / (hi - lo)) * 16}`).join(' ');
    return `<svg viewBox="0 0 100 24" style="width:100px;height:24px;"><polyline points="${pts}" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/>
      <circle cx="100" cy="${20 - ((vals[vals.length - 1] - lo) / (hi - lo)) * 16}" r="2.5" fill="var(--ink)"/></svg>`;
  })();
  el.innerHTML = `<div class="mono">Body</div>
    <div class="row" style="margin-top:10px;"><div class="grow"><div class="lead num">${e.length ? `${km1(t.latestKg)} kg` : 'No weigh-ins'}</div>
      <div class="meta mono">${t.perWeekKg != null ? `${t.perWeekKg > 0 ? '+' : ''}${t.perWeekKg} kg/week` : 'trend needs a week'}</div></div>
      <div>${spark}</div><button class="ghost" id="log-weight">Log</button></div>
    <div class="row"><div class="grow"><div class="sub">${S.sweat ? `Sweat rate ${S.sweat.sweatRateLPerHr} L/h · ${esc(S.sweat.tier)} sweater` : 'Sweat test'}</div>

      <button class="ghost" id="sweat-test">${S.sweat ? 'Redo' : 'Start'}</button></div>`;
  $('log-weight').addEventListener('click', openWeightSheet);
  $('sweat-test').addEventListener('click', openSweatSheet);
}

/* ---------- sheets ---------- */
const sheet = $('sheet');
function openSheet(title, html, after) {
  $('sheet-title').textContent = title; $('sheet-body').innerHTML = html;
  sheet.showModal(); if (after) after();
}
$('sheet-close').addEventListener('click', () => sheet.close());
sheet.addEventListener('click', (e) => {
  const r = sheet.getBoundingClientRect();
  if (e.target === sheet && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) sheet.close();
});

function openWeightSheet() {

    <label><span class="mono">Weight (kg)</span><input id="w-kg" type="number" step="0.1" min="30" max="200"></label>

    <button class="ghost wide" id="w-save">Save to Garmin</button><p class="sub" id="w-msg"></p></div>`, () => {
    $('w-date').valueAsDate = new Date();
    $('w-save').addEventListener('click', async () => {

        S.weight = await getJSON('/api/weight?refresh=1'); renderWeightRow(); sheet.close(); toast('Weight logged');
      } catch (e) { $('w-msg').textContent = e.message; $('w-msg').className = 'sub crit'; }

    <label><span class="mono">Before (kg)</span><input id="s-pre" type="number" step="0.1"></label>
    <label><span class="mono">After (kg)</span><input id="s-post" type="number" step="0.1"></label>
    <label><span class="mono">Minutes</span><input id="s-min" type="number" step="1" min="10"></label>
    <label><span class="mono">Drank (ml)</span><input id="s-ml" type="number" step="50" value="0"></label>
    <button class="ghost wide" id="s-go">Work it out</button><div id="s-out"></div></div>`, () => {
    $('s-go').addEventListener('click', async () => {
      try {
        const r = await postJSON('/api/sweat-rate', { preKg: Number($('s-pre').value), postKg: Number($('s-post').value), durationMin: Number($('s-min').value), fluidMl: Number($('s-ml').value || 0) });
        S.sweat = r;
        $('s-out').innerHTML = `<div class="second num gold" style="margin-top:10px;">${r.sweatRateLPerHr}<small style="font:400 16px var(--f-ui);color:var(--ink-2);"> L/h</small></div>
          <p class="sub" style="margin-top:8px;">${esc(r.guidance)}</p>`;
        renderWeightRow();
      } catch (e) { $('s-out').innerHTML = `<p class="sub crit">${esc(e.message)}</p>`; }
    });
  });
}

$('settings-btn').addEventListener('click', () => {
  openSheet('Settings', `<div class="stack">
    <p class="mono">Version {{ build }}</p>
    <form method="post" action="/gate/logout" id="lock-form"><button class="ghost wide" type="submit">Lock app</button></form>
    <button class="ghost wide" id="signout">Sign out of Garmin</button>
    <p class="sub">Lock asks for the app password again on this device. Signing out disconnects Garmin until the owner signs in again.</p></div>`, () => {
    if (!S.gateEnabled) $('lock-form').hidden = true;
    $('signout').addEventListener('click', async () => {
      if (!confirm('Sign out of Garmin? The app stops syncing until the owner signs in again.')) return;
      await postJSON('/api/logout', {}); location.reload();
    });
  });
});

/* ---------- tabs ---------- */
const loaded = {};
const loaders = { now: loadNow, plan: loadPlan, body: loadBody };
function loadTab(name, force = false) {
  if (!loaded[name] || force) {
    const p = (async () => { if (name !== 'now' && !S.progress) await loadTab('now'); await loaders[name](force); })();
    loaded[name] = p; p.catch(() => { if (loaded[name] === p) loaded[name] = null; });
  }
  return loaded[name];
}
function moveSlider(btn) {
  const s = $('nav-slider'), r = btn.getBoundingClientRect(), p = btn.parentElement.getBoundingClientRect();
  s.style.width = '20px';
  s.style.transform = `translateX(${r.left - p.left + r.width / 2 - 10}px)`;
}
async function showTab(name, force = false) {
  document.querySelectorAll('nav.tabs [role=tab]').forEach((b) => {
    const on = b.dataset.tab === name;
    b.setAttribute('aria-selected', String(on));
    if (on) moveSlider(b);
  });
  document.querySelectorAll('main > .view').forEach((v) => { v.hidden = v.id !== `view-${name}`; });
  if (location.hash !== `#${name}`) history.replaceState(null, '', `#${name}`);
  const view = $(`view-${name}`);
  try { await loadTab(name, force); }
  catch (e) { if (e.message !== 'locked') view.insertAdjacentHTML('afterbegin', `<p class="sub crit">Couldn't load from Garmin: ${esc(e.message)}</p>`); }
  if (!view.dataset.entered) { view.classList.add('fresh'); view.dataset.entered = '1'; }
}
document.querySelectorAll('nav.tabs [role=tab]').forEach((b) => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
window.addEventListener('resize', () => { const on = document.querySelector('nav.tabs [aria-selected=true]'); if (on) moveSlider(on); });

$('refresh-btn').addEventListener('click', async () => {
  const btn = $('refresh-btn'); btn.classList.add('spin');
  const cur = document.querySelector('nav.tabs [aria-selected=true]').dataset.tab;
  Object.keys(loaded).forEach((k) => { loaded[k] = null; });
  try { await showTab(cur, true); } finally { btn.classList.remove('spin'); }
  prefetch();
});
async function prefetch() { for (const n of ['plan', 'body']) { try { await loadTab(n); } catch { /* shown when opened */ } } }

/* ---------- connection ---------- */
let pollTimer = null;
function showConnect(state) {
  $('app-view').hidden = true; $('connect-view').hidden = false;
  const busy = state.status === 'logging_in', mfa = state.status === 'awaiting_mfa';
  $('connect-busy').hidden = !busy; $('mfa-form').hidden = !mfa;
  if (mfa || busy) { $('login-form').hidden = true; $('owner-btn').hidden = true; }
  const err = $('connect-error'); err.hidden = !state.error; err.textContent = state.error || '';
}
async function poll() {
  const st = await getJSON('/api/session');
  if (st.status === 'logged_in') { clearInterval(pollTimer); pollTimer = null; enterApp(st); return; }
  if (st.status === 'error') { clearInterval(pollTimer); pollTimer = null; $('owner-btn').hidden = true; $('login-form').hidden = false; }
  showConnect(st);
}
$('owner-btn').addEventListener('click', () => { $('owner-btn').hidden = true; $('login-form').hidden = false; $('email').focus(); });
$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault(); $('login-btn').disabled = true;
  await postJSON('/api/login', { email: $('email').value, password: $('password').value });
  if (!pollTimer) pollTimer = setInterval(poll, 1200);
});
$('mfa-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  await postJSON('/api/mfa', { code: $('mfa').value });
  if (!pollTimer) pollTimer = setInterval(poll, 1200);
});

function enterApp(state) {
  S.gateEnabled = state.gateEnabled;
  $('connect-view').hidden = true; $('app-view').hidden = false;
  const start = ['now', 'plan', 'body'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'now';
  showTab(start).then(() => setTimeout(prefetch, 300));
}

(async function init() {
  try {
    const st = await getJSON('/api/session');
    if (st.status === 'logged_in') enterApp(st); else showConnect(st);
  } catch (e) { if (e.message !== 'locked') showConnect({ status: 'error', error: e.message }); }
})();
</script>
</body>
