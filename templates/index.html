<script>
/* ---------- plumbing ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = {};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

async function getJSON(u) { const r = await fetch(u); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || r.status); return d; }
async function postJSON(u, b) {
  const r = await fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || r.status); return d;
}
const toSec = (p) => { const [m, s] = String(p).split(':').map(Number); return m * 60 + s; };
const fmtPace = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const fmtHMS = (s) => `${Math.floor(s / 3600)}:${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const km1 = (k) => (k == null ? '–' : (Math.round(k * 10) / 10).toString());
const mins = (m) => (m >= 60 ? `${Math.floor(m / 60)}h ${String(Math.round(m % 60)).padStart(2, '0')}` : `${Math.round(m)} min`);
const d8 = (d) => new Date(`${d}T00:00:00`);
/* Local YYYY-MM-DD. toISOString() would shift a Bangkok date back a day. */
const isoLocal = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const dayDiff = (a, b) => Math.round((d8(b) - d8(a)) / 86400000);
const short = (d) => d8(d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const longDate = (d) => d8(d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

const KIND = { easy: 'Easy', long: 'Long', tempo: 'Tempo', mp: 'Marathon pace', recovery: 'Recovery' };
/* The coaching constants come from /api/plan (plan_data.py is the one source), filled in
   by loadNow() before anything renders. Effort, not pace, is the instruction on aerobic days. */
const CEILING = {};
const AEROBIC = [];
const PHASE = {};
const PLANNED_RPE = {};
let HR_TOL = 2;
function adoptPlanConstants(plan) {
  Object.assign(CEILING, plan.hrCeilings || {});
  AEROBIC.splice(0, AEROBIC.length, ...(plan.aerobicKinds || []));
  Object.assign(PHASE, plan.phases || {});
  Object.assign(PLANNED_RPE, plan.plannedRpe || {});
  if (plan.hrCeilingToleranceBpm != null) HR_TOL = plan.hrCeilingToleranceBpm;
}
/* Session RPE, the way coaches take it after a run (Foster's 1-10, with its anchor words;
   the blanks are deliberate - the scale has no word at 6, 8 or 9). Every value is tappable,
   so a 3 is a 3 and the planned band for each session can be marked exactly. */
const FEEL = [[1, 'Very easy'], [2, 'Easy'], [3, 'Moderate'], [4, 'A bit hard'], [5, 'Hard'], [6, ''], [7, 'Very hard'], [8, ''], [9, ''], [10, 'Max']];
const MOOD = [[1, 'Rough'], [2, 'Flat'], [3, 'Fine'], [4, 'Good'], [5, 'Great']];
const MOTIV = [[1, 'Empty'], [2, 'Low'], [3, 'Steady'], [4, 'Keen'], [5, 'Fired']];

const sessionFor = (d) => (S.plan?.sessions || []).find((s) => s.date === d);
const rowFor = (d) => (S.progress?.rows || []).find((r) => r.date === d);
const feelOf = (r) => (r?.activityId ? S.feels?.[String(r.activityId)] : null) || {};
const curWeek = () => { const due = (S.progress?.rows || []).filter((r) => r.status !== 'upcoming'); return due.length ? due[due.length - 1].week : 'W1'; };
const done = (r) => r.status === 'done' || r.status === 'partial';

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200); }
function countUp(el, to, fmt = (v) => Math.round(v).toString(), ms = 600) {
  if (!el) return;
  if (reduceMotion) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / ms); el.textContent = fmt(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function safe(label, el, fn) { try { fn(); } catch (e) { console.error(label, e); el.innerHTML = `<p class="sub crit">Couldn't show ${esc(label)}: ${esc(e.message)}</p>`; } }

/* ---------- the moment ---------- */
function moment() {
  const today = S.progress.today, race = S.plan.race.date;
  if (today === race) return 'RACE';
  if (today > race) return 'AFTER_RACE';
  const r = rowFor(today);
  if (!r) return 'BROWSE';
  return done(r) ? 'AFTER' : 'BEFORE';
}

/* ---------- the band: one component, five uses ---------- */
function bandSvg(opts) {
  // drawn in whatever unit it was given: pace by default, heart rate on easy days
  const { fast, slow, actual, ghost, label, inZone, h = 96, animate = true, fmt: F = fmtPace, unit = 's', pad = 45 } = opts;
  const W = 350, y = 56, x0 = 16, x1 = 334;
  let lo = Math.min(fast, actual ?? fast, ghost ?? fast) - pad;
  let hi = Math.max(slow, actual ?? slow, ghost ?? slow) + pad;
  const x = (p) => x0 + ((Math.max(lo, Math.min(hi, p)) - lo) / (hi - lo)) * (x1 - x0);
  const zx = x(fast), zw = Math.max(10, x(slow) - x(fast));
  let g = `<line class="track" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"/>
    <rect class="glow" x="${zx - 8}" y="${y - 14}" width="${zw + 16}" height="28" rx="14"/>
    <rect class="zone" x="${zx}" y="${y - 6}" width="${zw}" height="12" rx="6"/>
    ${zw < 72
      ? `<text class="ax" x="${zx + zw / 2}" y="${y + 24}" text-anchor="middle">${esc(F(fast))}–${esc(F(slow))}</text>`
      : `<text class="ax" x="${zx}" y="${y + 24}" text-anchor="start">${esc(F(fast))}</text>
         <text class="ax" x="${zx + zw}" y="${y + 24}" text-anchor="end">${esc(F(slow))}</text>`}`;
  if (ghost != null && actual == null) {
    g += `<circle class="ghost" cx="${x(ghost)}" cy="${y}" r="6"/>
      <text class="ax" x="${x(ghost)}" y="${y - 16}" text-anchor="middle">last ${esc(F(ghost))}</text>`;
  }
  if (actual != null) {
    const ax = x(actual), out = !inZone;
    if (out) {
      const edge = actual < fast ? x(fast) : x(slow);
      const delta = actual < fast ? fast - actual : actual - slow;
      g += `<line class="lead-line" x1="${edge}" x2="${ax}" y1="${y}" y2="${y}"/>
        <text class="delta" x="${(edge + ax) / 2}" y="${y + 24}" text-anchor="middle">${actual < fast ? '−' : '+'}${Math.round(delta)}${esc(unit)}</text>`;
    }
    const from = x1 - ax;
    g += `<g class="mark-g" style="--from:${from}px"><circle class="mark" cx="${ax}" cy="${y}" r="8"/>
      <text class="lbl" x="${ax}" y="${y - 20}" text-anchor="middle">${esc(label || F(actual))}</text></g>`;
  }
  const cls = `band${inZone && actual != null ? ' in' : ''}${animate && !reduceMotion ? ' anim' : ''}`;
  return `<svg class="${cls}" viewBox="0 0 ${W} ${h}" role="img" aria-label="Target band ${F(fast)} to ${F(slow)}${actual != null ? `, you ran ${F(actual)}` : ''}">${g}</svg>`;
}
/* The same band for an easy day, in beats: the zone runs up to the ceiling, the mark is the run's HR. */
function hrBandSvg(kind, hr) {
  const cap = ceilingFor(kind);
  return bandSvg({ fast: cap - 20, slow: cap, actual: hr, inZone: heldCeiling(hr, kind), label: String(Math.round(hr)), fmt: (v) => String(Math.round(v)), unit: '', pad: 12 });
}
/* the same idea, 4px tall, for plan rows */
function bandStrip(fast, slow, actual, inZone) {
  const W = 120, pad = 40;
  const lo = Math.min(fast, actual ?? fast) - pad, hi = Math.max(slow, actual ?? slow) + pad;
  const x = (p) => ((Math.max(lo, Math.min(hi, p)) - lo) / (hi - lo)) * W;
  return `<svg class="band" viewBox="0 0 ${W} 8" style="width:${W}px" aria-hidden="true">
    <line class="track" x1="0" x2="${W}" y1="4" y2="4"/>
    <rect class="zone" x="${x(fast)}" y="1" width="${Math.max(4, x(slow) - x(fast))}" height="6" rx="3"/>
    ${actual != null ? `<circle cx="${x(actual)}" cy="4" r="4" fill="${inZone ? 'var(--ink)' : 'var(--crit)'}" stroke="var(--ground)" stroke-width="1.5"/>` : ''}</svg>`;
}

/* ---------- the summary: today's instruction, Runny-style ---------- */
const ICON = {
  dist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  pace: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9 2h6"/></svg>',
  hr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-8.8 1.9A5 5 0 0 0 3.2 5.6C1 8 2 12 12 20c10-8 11-12 8.8-14.4z"/></svg>',
};
function renderSummary() {
  const el = $('s-summary'); if (!el) return;
  const rows = S.progress.rows, race = S.plan.race;
  const wkNo = Number(curWeek().replace('W', '')) || 1;
  const days = Math.max(0, dayDiff(S.progress.today, race.date));
  const wkRows = rows.filter((r) => r.week === curWeek());
  const weekDone = wkRows.reduce((a, r) => a + (r.actualKm || 0), 0);
  const weekPlan = wkRows.reduce((a, r) => a + r.plannedKm, 0);
  const weekRuns = wkRows.filter(done).length, weekTotal = wkRows.length;
  const pred = S.progress.prediction;
  const outLabel = pred?.available ? esc(pred.avgPredictedLabel) : '—';
  const outSub = pred?.available ? (pred.verdict === 'on_goal' ? 'on for sub-4' : 'projected finish') : 'needs more data';

  const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const monday = (() => { const d = d8(S.progress.today); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return d; })();
  const chips = WD.map((dd, i) => {
    const date = new Date(monday); date.setDate(date.getDate() + i);
    const iso = isoLocal(date), r = rows.find((x) => x.date === iso), today = iso === S.progress.today;
    const st = today ? 'now' : (r && done(r) ? 'done' : '');
    return `<div class="daychip ${st}"><b>${date.getDate()}</b><span>${dd[0]}</span></div>`;
  }).join('');

  // today's instruction → the GO card
  const row = rowFor(S.progress.today), s = sessionFor(S.progress.today);
  const m = S.moment;
  let goSub, goBig;
  if (m === 'RACE') { goSub = 'Bangsaen · race day'; goBig = esc((race.stretch_pace || '').split('/')[0]) + '<small>/km</small>'; }
  else if (m === 'AFTER_RACE') { goSub = 'Bangsaen'; goBig = 'done'; }
  else if (!s) { goSub = 'Rest day'; goBig = 'rest'; }
  else {
    const kind = s.kind, cap = ceilingFor(kind), aerobic = AEROBIC.includes(kind);
    goSub = `${esc(KIND[kind])} · ${km1(s.km)} km`;
    goBig = aerobic ? `HR &le; ${cap}` : `${esc(s.paceHi)}–${esc(s.paceLo)}<small>/km</small>`;
  }

  // last completed run → three glossy capsules
  const last = [...rows].reverse().find((r) => done(r) && r.actualKm);
  const caps = last ? [
    ['dist', 'distance', km1(last.actualKm), 'km'],
    ['pace', 'pace', esc(last.actualPaceLabel || '–'), '/km'],
    ['hr', 'avg hr', last.actualHr ? Math.round(last.actualHr) : '–', 'bpm'],
  ] : [];

  const rd = S.readiness;
  const rpill = rd?.available ? `<span class="rpill ${esc(rd.verdict)}">${rd.score} ready</span>` : '';
  el.innerHTML = `
    <div class="greet"><span class="g1">Week ${wkNo}</span>${rpill || `<span class="g2">${days} days to Bangsaen</span>`}</div>
    <div class="daychips">${chips}</div>
    ${wxStrip()}
    <button class="gocard" id="go-card">
      <div><span class="mono">ready. steady.</span><div class="goline">${goSub}</div></div>
      <div class="gobig">${goBig}</div>
    </button>
    ${caps.length ? `<button class="lastrun-head" id="lastrun-open">
        <span class="mono">Last run${last && last.actualDate ? ` · ${esc(short(last.actualDate))}` : (last ? ` · ${esc(short(last.date))}` : '')}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="caprow">${caps.map(([ic, lbl, v, u]) => `<div class="cap">
        <span class="capicon">${ICON[ic]}</span><span class="caplbl">${lbl}</span>
        <b class="capnum">${v}</b><span class="capunit">${u}</span></div>`).join('')}</div>` : ''}
    <div class="minirow">
      <button class="minicard" id="mini-week"><div class="mc-main"><div class="mc-big gold">${km1(weekDone)}</div><div class="mc-lbl">of ${km1(weekPlan)} km this week</div></div>
        ${ringSvg(weekPlan > 0 ? weekDone / weekPlan : 0, 'var(--gold)', `${weekRuns}/${weekTotal}`, 'runs', 52)}</button>
      <button class="minicard" id="mini-outlook"><div class="mc-main"><div class="mc-big">${esc(outLabel)}</div><div class="mc-lbl">${esc(outSub)}</div></div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width:16px;height:16px;color:var(--ink-3)"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>`;

  const go = $('go-card');
  if (go) go.addEventListener('click', () => $('s-hero')?.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }));
  armRings(el);
  if ($('lastrun-open')) $('lastrun-open').addEventListener('click', openRunSheet);
  if ($('mini-week')) $('mini-week').addEventListener('click', () => showTab('plan'));
  if ($('mini-outlook')) $('mini-outlook').addEventListener('click', openOutlookSheet);
  if ($('wx-open')) $('wx-open').addEventListener('click', openWeatherSheet);
}

/* ---------- adaptive conditions ---------- */
function wxStrip() {
  const w = S.weather;
  if (!w || !w.available) return '';
  const offset = w.easyPaceOffsetSec ? `easy +${w.easyPaceOffsetSec}s/km` : 'good conditions';
  return `<button class="wx" id="wx-open" aria-label="Today's conditions">
    <span class="dot ${esc(w.tier)}"></span>
    <span class="wxmain"><b>${w.apparentC}&deg;</b> feels &middot; ${w.humidityPct != null ? w.humidityPct + '% &middot; ' : ''}${esc(w.tier)} &middot; ${esc(offset)}</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>`;
}
function openWeatherSheet() {
  const w = S.weather; if (!w || !w.available) { toast('Weather unavailable'); return; }
  const cool = w.coolWindow
    ? `<div class="row"><div class="grow"><div class="sub" style="color:var(--ink)">Coolest window</div><div class="meta mono">${esc(w.coolWindow.hour)} &middot; feels ${w.coolWindow.apparentC}&deg;</div></div><div class="val">run then</div></div>`
    : '';
  // next quality session: warn if it lands in the heat
  const rows = S.progress?.rows || [];
  const nextQ = rows.find((r) => ['tempo', 'mp'].includes(r.kind) && (r.status === 'upcoming' || r.date === S.progress.today));
  const qWarn = (nextQ && w.tier !== 'comfortable')
    ? `<p class="sub" style="margin-top:14px;"><b style="color:var(--ink)">${esc(KIND[nextQ.kind])} on ${esc(short(nextQ.date))}.</b> In this heat your heart rate hits its cap at a slower pace, so run it in the cool window or the numbers mislead you.</p>`
    : '';
  openSheet('Conditions · ' + esc(w.place), `<div class="wxsheet">
    <div class="mono">Feels like</div><div class="big">${w.apparentC}&deg;<span style="font-size:16px;color:var(--ink-3)"> air ${w.tempC}&deg; &middot; ${w.humidityPct != null ? w.humidityPct + '% rh' : ''}</span></div>
    <p class="sub" style="margin-top:12px;">${esc(w.note)}</p>
    <div style="margin-top:14px;">
      <div class="row"><div class="grow"><div class="sub" style="color:var(--ink)">Easy pace today</div><div class="meta mono">at HR &le; ${ceilingFor('easy')}, in this heat</div></div><div class="val">${w.easyPaceOffsetSec ? '+' + w.easyPaceOffsetSec + 's/km' : 'normal'}</div></div>
      ${cool}
    </div>
    ${qWarn}
    <p class="mono" style="margin-top:16px;">Live from open-meteo &middot; updates every 30 min</p>
  </div>`);
}

/* ---------- rings: the score language ---------- */
function ringSvg(pct, color, big, sub, size = 96) {
  const r = 42, c = 2 * Math.PI * r, k = Math.max(0, Math.min(1, pct || 0));
  return `<svg class="ring" viewBox="0 0 96 96" style="width:${size}px;height:${size}px" aria-hidden="true">
    <circle class="rtrack" cx="48" cy="48" r="${r}"/>
    <circle class="arc" cx="48" cy="48" r="${r}" style="stroke:${color};stroke-dasharray:${c.toFixed(1)};stroke-dashoffset:${c.toFixed(1)}" data-off="${(c * (1 - k)).toFixed(1)}"/>
    <text class="rbig" x="48" y="${sub ? 50 : 56}" text-anchor="middle">${big}</text>
    ${sub ? `<text class="rsub" x="48" y="66" text-anchor="middle">${esc(sub)}</text>` : ''}</svg>`;
}
function armRings(root) {
  requestAnimationFrame(() => root.querySelectorAll('.ring .arc').forEach((a) => { a.style.strokeDashoffset = a.dataset.off; }));
}

/* ---------- NOW ---------- */
function renderStatus() {
  const r = S.readiness, flags = (S.insights || []).filter((i) => ['critical', 'warning'].includes(i.severity) && (!i.date || dayDiff(i.date, S.progress.today) <= 7));
  const order = { critical: 0, warning: 1 };
  flags.sort((a, b) => (order[a.severity] ?? 2) - (order[b.severity] ?? 2));
  const top = flags[0];
  // Green, amber, red -> what to do today, not a status word.
  const word = r?.available ? (r.verdict === 'green' ? 'Ready' : r.verdict === 'amber' ? 'Careful' : 'Rest') : 'No data';
  const cls = r?.verdict === 'green' ? 'good' : r?.verdict === 'red' ? 'crit' : '';
  document.documentElement.style.setProperty('--dawn-gold', r?.verdict === 'green' ? .12 : r?.verdict === 'red' ? 0 : .06);
  document.documentElement.style.setProperty('--dawn-blue', r?.verdict === 'red' ? .26 : r?.verdict === 'green' ? .22 : .18);
  const reasons = r?.reasons || [], more = reasons.slice(1);
  const pivot = r?.pivotSuggestion?.message;   // amber/red on a quality day: the decision, shown without a tap
  const ringCol = r?.verdict === 'green' ? 'var(--good)' : r?.verdict === 'red' ? 'var(--crit)' : 'var(--gold)';
  $('s-status').innerHTML = `
    <div class="scorehead">
      ${r?.available ? ringSvg(r.score / 100, ringCol, String(r.score), word) : ''}
      <button id="status-line" class="status-line grow" aria-expanded="false" ${more.length ? '' : 'disabled'}>
        <span class="grow">
          <span class="mono ${cls}">${r?.available ? 'Readiness' : esc(word)}</span>
          <span class="sub">${esc(reasons[0] || 'Readiness needs sleep and resting-HR data.')}</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div id="status-more" class="hide" style="margin-top:6px;">${more.map((m) => `<p class="sub">${esc(m)}</p>`).join('')}</div>
    ${pivot ? `<p class="sub ${r.verdict === 'red' ? 'crit' : ''}" style="margin-top:12px;"><b style="color:var(--ink)">Today's session.</b> ${esc(pivot)}</p>` : ''}
    ${top ? `<p class="sub crit" style="margin-top:12px;"><b>${esc(top.title)}</b> ${esc(top.suggestion)}</p>` : ''}`;
  armRings($('s-status'));
  const line = $('status-line');
  line.addEventListener('click', () => {
    const open = $('status-more').classList.toggle('hide') === false;
    line.setAttribute('aria-expanded', String(open));
  });
}

function ceilingFor(kind) { return CEILING[kind] ?? 160; }
/* Same verdict as the backend: under the ceiling, give or take the tolerance. */
function heldCeiling(hr, kind) { return hr <= ceilingFor(kind) + HR_TOL; }

function renderHero() {
  const el = $('s-hero'), m = S.moment;
  if (m === 'RACE' || m === 'AFTER_RACE') return renderRaceHero(el, m);
  const focus = m === 'BEFORE' ? S.progress.today : (m === 'AFTER' ? S.progress.today : (S.progress.rows.find((r) => r.status === 'upcoming') || {}).date);
  if (!focus) { el.innerHTML = '<p class="sub">Plan complete. The race is next.</p>'; return; }
  const s = sessionFor(focus), row = rowFor(focus), kind = s?.kind || 'easy';
  const cap = ceilingFor(kind), aerobic = AEROBIC.includes(kind);
  const shoe = (S.shoes || []).find((x) => x.role === (kind === 'mp' ? 'race' : 'training'));

  if (m === 'AFTER' && row && done(row)) {
    const f = feelOf(row), mpKm = row.mpEffortKm;
    // A long run with a marathon-pace finish is judged on the finish, against the MP
    // ceiling: the easy kilometres were never the point, and the finish lifts the
    // whole-run average on purpose. Every other aerobic run is judged on its own HR.
    const finish = kind === 'long' && mpKm;
    const capKind = finish ? 'mp' : kind, capUsed = ceilingFor(capKind);
    const hr = finish ? (row.mpEffortHr || row.actualHr) : row.actualHr;
    const heldCap = hr ? heldCeiling(hr, capKind) : null;
    const heroIsHr = aerobic && !finish && !!hr;   // effort was the instruction, so effort is the number
    const heroText = heroIsHr
      ? `${Math.round(hr)}<small>bpm</small>`
      : `${esc(finish ? row.mpEffortPaceLabel : row.actualPaceLabel)}<small>/km</small>`;
    const kickerTail = heroIsHr ? `${esc(row.actualPaceLabel)}/km` : (hr ? `hr ${Math.round(hr)}` : '');
    el.innerHTML = `
      <div class="kicker mono">Today &middot; ${esc(KIND[kind])} &middot; done ${km1(row.actualKm)} km${kickerTail ? ` &middot; ${kickerTail}` : ''}</div>
      <div class="hero num${heldCap === false ? '' : ' gold'}" id="hero-n">${heroText}</div>
      <div id="hero-band" style="margin-top:14px;"></div>
      <p class="sub" style="margin-top:10px;">${heldCap == null ? '' : heldCap
        ? `<span class="good">Held the ceiling.</span> HR ${Math.round(hr)} against ${capUsed}${finish ? ' on the finish.' : streakText(kind)}`
        : `<span class="crit">Over the ceiling.</span> HR ${Math.round(hr)} against a ${capUsed} cap${finish ? ' on the finish' : ''} — that is the habit to break.`}
        ${finish ? ` Marathon-pace finish ${esc(row.mpEffortPaceLabel)}/km over ${km1(mpKm)} km, whole run ${esc(row.actualPaceLabel)}/km.` : ''}</p>
      ${row.reps?.length ? `<p class="sub" style="margin-top:8px;">Reps: ${row.reps.map((rp) => `<b style="color:var(--ink)">${esc(fmtPace(rp.paceSecPerKm))}</b>${rp.hr ? `<span class="dim"> ${rp.hr}</span>` : ''}`).join(' · ')}</p>` : ''}
      <div id="feel-slot" style="margin-top:22px;"></div>`;
    if (heroIsHr) {
      $('hero-band').innerHTML = hrBandSvg(kind, hr);
    } else if (s) {
      const mpStep = finish ? (s.steps || []).find((st) => st.kind === 'mp') : null;
      const band = mpStep
        ? { fast: toSec(mpStep.paceFast), slow: toSec(mpStep.paceSlow), actual: row.mpEffortPace, label: row.mpEffortPaceLabel }
        : { fast: toSec(s.paceHi), slow: toSec(s.paceLo), actual: row.actualPace, label: row.actualPaceLabel };
      band.inZone = band.actual != null && band.fast <= band.actual && band.actual <= band.slow;
      $('hero-band').innerHTML = bandSvg(band);
    }
    renderFeel(row, f);
    return;
  }

  const prev = [...S.progress.rows].reverse().find((r) => r.kind === kind && done(r) && r.actualPace);
  el.innerHTML = `
    <div class="kicker mono">${m === 'BEFORE' ? 'Today' : short(focus)} &middot; ${esc(KIND[kind])} &middot; ${km1(s.km)} km &middot; ${esc(mins(s.durationMin))}${shoe ? ` &middot; ${esc(shoe.name)}` : ''}</div>
    ${aerobic
      ? `<div class="hero num gold">HR &le; ${cap}</div>
         <p class="sub" style="margin-top:8px;">Effort is the instruction. That usually lands near ${esc(s.paceHi)}–${esc(s.paceLo)}/km, and slower is fine.</p>`
      : `<div class="hero num gold">${esc(s.paceHi)}–${esc(s.paceLo)}<small>/km</small></div>
         <p class="sub" style="margin-top:8px;">Start at the slow end. Keep HR under ${cap}.</p>`}
    <div id="hero-band" style="margin-top:16px;"></div>
    ${s.steps.length > 1 ? `<div style="margin-top:18px;">${s.steps.map(stepRow).join('')}</div>` : ''}
    <div class="why"><img src="/static/logo-small.svg" alt=""><p>${cue(kind, prev, cap)}</p></div>
    ${m === 'BEFORE' && S.fuelToday?.before ? `<p class="sub" style="margin-top:12px;"><span class="mono">Before</span> ${esc(S.fuelToday.before)}</p>` : ''}
    ${s.note ? `<button class="linkish" id="note-more" style="margin-top:12px;">Why this session</button><p class="sub hide" id="note-body" style="margin-top:8px;">${esc(s.note)}</p>` : ''}`;
  $('hero-band').innerHTML = bandSvg({ fast: toSec(s.paceHi), slow: toSec(s.paceLo), ghost: prev?.actualPace });
  if ($('note-more')) $('note-more').addEventListener('click', () => { $('note-body').classList.toggle('hide'); });
}

/* Steady aerobic runs only: an MP-finish long run is judged on its finish, not here. */
const steadyAerobic = (r) => AEROBIC.includes(r.kind) && done(r) && r.actualHr && !r.mpEffortKm;

function streakText(kind) {
  const rows = S.progress.rows.filter(steadyAerobic);
  let n = 0;
  for (const r of [...rows].reverse()) { if (heldCeiling(r.actualHr, r.kind)) n++; else break; }
  return n > 1 ? ` — ${n} in a row.` : '.';
}

function stepRow(st) {
  const band = st.paceFast && st.paceSlow ? `${st.paceFast}–${st.paceSlow}` : '';
  const name = st.role === 'repeat' ? `${st.reps}×${km1(st.km)} km ${KIND[st.kind].toLowerCase()}`
    : st.role === 'warmup' ? `${km1(st.km)} km warm-up` : st.role === 'cooldown' ? `${km1(st.km)} km cool-down` : `${km1(st.km)} km ${KIND[st.kind].toLowerCase()}`;
  return `<div class="row"><div class="grow"><div class="sub">${esc(name)}${st.recoveryKm ? ` &middot; ${km1(st.recoveryKm)} km jog between` : ''}</div></div><div class="val">${esc(band)}</div></div>`;
}

function cue(kind, prev, cap) {
  if (!prev) return `First ${esc(KIND[kind].toLowerCase())} of the block. Set the pattern: start at the slow end.`;
  const f = feelOf(prev), hr = prev.mpEffortHr || prev.actualHr;
  const capKind = prev.mpEffortKm && kind === 'long' ? 'mp' : kind;
  const over = hr && !heldCeiling(hr, capKind);
  const overBy = hr ? Math.round(hr) - (ceilingFor(capKind) + HR_TOL) : 0;
  let t = `Last ${esc(KIND[kind].toLowerCase())} ran <b>${esc(prev.actualPaceLabel)}</b>`;
  t += hr ? ` at HR ${Math.round(hr)}` : '';
  // A small overshoot on an aerobic run the runner rated very easy is heat, not
  // a discipline miss - saying "hold it down" there contradicts the conditions strip.
  if (over && AEROBIC.includes(kind) && f.rpe && f.rpe <= 3 && overBy <= 12) {
    t += ` — reads over the ${cap} ceiling, but you called it ${f.rpe}/10. That is the heat, not the effort. Same again.`;
  } else if (over) {
    t += ` — over the ${cap} ceiling. Today, hold it down.`;
    if (f.rpe) t += ` You called it ${f.rpe}/10.`;
  } else {
    t += ` — inside the ceiling. Same again.`;
    if (f.rpe) t += ` You called it ${f.rpe}/10.`;
  }
  return t;
}

function renderRaceHero(el, m) {
  const race = S.plan.race, days = dayDiff(S.progress.today, race.date);
  const first5 = S.racePlan?.pacing?.segments?.[0];
  if (m === 'AFTER_RACE') {
    const ra = S.progress.raceActivity;
    if (!ra) {
      el.innerHTML = `<div class="kicker mono">Bangsaen done</div>
        <div class="hero">Finished</div>
        <p class="sub" style="margin-top:10px;">Three years of this is in the legs. The race shows here once the watch has synced.</p>`;
      return;
    }
    const [gh, gm, gs] = race.stretch_time.split(':').map(Number);
    const goalSec = gh * 3600 + gm * 60 + (gs || 0);
    const underGoal = ra.durationSec <= goalSec;
    el.innerHTML = `<div class="kicker mono">Bangsaen Marathon &middot; ${esc(short(ra.date))} &middot; ${km1(ra.km)} km</div>
      <div class="hero num${underGoal ? ' gold' : ''}" id="hero-n">${esc(ra.finishLabel)}</div>
      <p class="sub" style="margin-top:10px;">${esc(ra.paceLabel)}/km${ra.hr ? ` at HR ${Math.round(ra.hr)}` : ''}. Goal was ${esc(race.stretch_time)}${underGoal ? ' — <span class="good">done</span>.' : `, ${esc(fmtHMS(ra.durationSec - goalSec))} short of it. Previous best 4:42:00.`}</p>
      <p class="sub" style="margin-top:8px;">Log how it felt while it is fresh. The route and every kilometre are below.</p>
      <div id="feel-slot" style="margin-top:22px;"></div>`;
    // A marathon should feel like an 8 or a 9. Anything less and there was more in the tank.
    const raceRow = { kind: 'mp', activityId: ra.activityId, date: ra.date, actualDate: null, plannedRpe: [8, 9] };
    renderFeel(raceRow, feelOf(raceRow));
    return;
  }
  el.innerHTML = `<div class="kicker mono">Race day &middot; ${days === 0 ? 'today' : `${days} days`} &middot; goal ${esc(race.stretch_time)}</div>
    <div class="hero num gold">${esc(first5 ? first5.paceLabel : '5:50')}<small>/km</small></div>
    <p class="sub" style="margin-top:8px;">First 5 km only. Deliberately slower than goal pace.</p>
    <div class="why"><img src="/static/logo-small.svg" alt=""><p>Hold this while everyone passes you. <b>2024 and 2025 were both lost in the first hour</b>, not the last.</p></div>`;
}

function renderFeel(row, f) {
  const [lo, hi] = row.plannedRpe || PLANNED_RPE[row.kind] || [3, 5];
  const slot = $('feel-slot');
  // The planned band is marked exactly; one above it is still within a coach's tolerance.
  slot.innerHTML = `<div class="mono">How hard was it? &middot; planned ${lo}–${hi}</div>
    <div class="scale ten" id="rpe">${FEEL.map(([v, w]) => `<button type="button" data-v="${v}" aria-pressed="${f.rpe === v}" class="${v >= lo && v <= hi ? 'planned' : ''}" aria-label="${v}${w ? ` ${esc(w)}` : ''}"><span class="n">${v}</span><span class="w">${esc(w)}</span></button>`).join('')}</div>
    ${f.rpe ? `<p class="sub" style="margin-top:10px;">${f.rpe > hi + 1 ? '<span class="crit">Harder than it should have been.</span>' : f.rpe < lo - 1 ? '<span class="dim">Easier than planned — fine on an easy day, a missed stimulus on a quality one.</span>' : 'About right for this session.'}</p>` : ''}
    <div class="note-field">
      <textarea id="feel-note" maxlength="500" placeholder="In your own words…">${esc(f.note || '')}</textarea>
      ${window.webkitSpeechRecognition || window.SpeechRecognition ? '<button class="ghost" id="dictate" aria-label="Dictate">🎙</button>' : ''}
    </div>`;
  const save = async (rpe, note) => {
    try {
      await postJSON('/api/feel', { activityId: row.activityId, date: row.actualDate || row.date, rpe, note });
      S.feels = { ...(S.feels || {}), [String(row.activityId)]: { rpe, date: row.actualDate || row.date, note } };
      toast(note ? 'Saved' : `Felt ${rpe}/10`);
      renderHero(); renderWeek();
    } catch (e) { toast(e.message); }
  };
  slot.querySelectorAll('#rpe button').forEach((b) => b.addEventListener('click', () => save(Number(b.dataset.v), $('feel-note').value)));
  $('feel-note').addEventListener('blur', () => {
    const cur = feelOf(row);
    if (!cur.rpe || $('feel-note').value === (cur.note || '')) return;
    save(cur.rpe, $('feel-note').value);
  });
  if ($('dictate')) $('dictate').addEventListener('click', () => {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new R(); rec.lang = 'en-IN'; rec.interimResults = false;
    rec.onresult = (e) => { $('feel-note').value = `${$('feel-note').value} ${e.results[0][0].transcript}`.trim(); $('feel-note').dispatchEvent(new Event('blur')); };
    rec.start(); toast('Listening…');
  });
}

/* The route, drawn from the GPS track and coloured by how it was run:
   on a quality session gold is the work; on an easy run gold is under the
   ceiling and red is over it. No tiles, no keys - just the line. */
function renderRoute(target) {
  const el = target || $('s-route'), rt = S.route, row = S.routeRow;
  if (!rt?.available || !row) { if (el) el.innerHTML = '<p class="sub">No GPS track on the last run.</p>'; return; }
  el.hidden = false;
  const s = sessionFor(row.date) || {}, quality = ['tempo', 'mp'].includes(row.kind);
  // the race has no session: its "work" is anything at goal pace or quicker
  const slowBound = s.paceLo ? toSec(s.paceLo) : (row.race ? toSec(S.plan.race.stretch_pace.split('/')[0]) : null);
  const cap = ceilingFor(row.kind);
  const W = 350, H = 230, pad = 16;
  const b = rt.bounds, latMid = (b.minLat + b.maxLat) / 2;
  const kx = Math.cos((latMid * Math.PI) / 180);  // metres per degree of longitude shrink with latitude
  const spanX = Math.max(1e-6, (b.maxLon - b.minLon) * kx), spanY = Math.max(1e-6, b.maxLat - b.minLat);
  const scale = Math.min((W - pad * 2) / spanX, (H - pad * 2) / spanY);
  const offX = (W - spanX * scale) / 2, offY = (H - spanY * scale) / 2;
  const x = (lon) => offX + (lon - b.minLon) * kx * scale;
  const y = (lat) => H - (offY + (lat - b.minLat) * scale);  // north up

  // one path per colour so the whole trace is two or three <path> elements, not 400
  const groups = { hot: [], base: [], over: [] };
  let cur = null, curKey = null;
  rt.points.forEach((p) => {
    const key = quality
      ? (p.paceSecPerKm && slowBound && p.paceSecPerKm <= slowBound ? 'hot' : 'base')
      : (p.hr ? (p.hr <= cap ? 'hot' : 'over') : 'base');
    if (key !== curKey) {
      if (cur && cur.length > 1) groups[curKey].push(cur);
      cur = cur && cur.length ? [cur[cur.length - 1]] : [];   // bridge the seam
      curKey = key;
    }
    cur.push(`${x(p.lon).toFixed(1)},${y(p.lat).toFixed(1)}`);
  });
  if (cur && cur.length > 1) groups[curKey].push(cur);
  const path = (runs, stroke, width) => runs.map((r) => `<polyline points="${r.join(' ')}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const first = rt.points[0], last = rt.points[rt.points.length - 1];

  el.innerHTML = `<div class="mono">The route &middot; ${km1(rt.km)} km</div>
    <p class="sub" style="margin-top:8px;">${quality
      ? '<span style="color:var(--gold)">Gold</span> is the work at target pace, grey the warm-up, jogs and cool-down.'
      : '<span style="color:var(--gold)">Gold</span> is under your heart-rate ceiling, <span class="crit">red</span> is over it.'}</p>
    <svg class="chart" viewBox="0 0 ${W} ${H}" style="margin-top:10px;" role="img" aria-label="Route of the run, ${km1(rt.km)} km">
      ${path(groups.base, 'var(--ink-4)', 3)}
      ${path(groups.over, 'var(--crit)', 3.5)}
      ${path(groups.hot, 'var(--gold)', 3.5)}
      <circle cx="${x(first.lon)}" cy="${y(first.lat)}" r="5" fill="var(--ink)" stroke="var(--ground)" stroke-width="2"/>
      <circle cx="${x(last.lon)}" cy="${y(last.lat)}" r="5" fill="none" stroke="var(--ink)" stroke-width="2"/>
    </svg>
    ${rt.continuity ? `<p class="sub" style="margin-top:12px;">Continuity: <b style="color:var(--ink)">${100 - rt.continuity.walkPct}% running</b> &middot; longest unbroken ${rt.continuity.longestRunMin} min &middot; ${rt.continuity.breaks} break${rt.continuity.breaks === 1 ? '' : 's'}</p>` : ''}
    ${splitRows(rt.splits, row)}`;
  const tog = $('splits-toggle');
  if (tog) tog.addEventListener('click', () => {
    const open = $('splits-body').classList.toggle('hide') === false;
    tog.setAttribute('aria-expanded', String(open));
  });
}

/* Per-kilometre splits, computed from Garmin's distance stream - the watch only
   records laps, so an easy run with auto-lap off arrives as one 8 km lap.
   Folded by default: the week and the outlook matter more than km 7 of 8,
   and the debrief is one tap away. */
function splitRows(splits, row) {
  if (!splits?.length) return '';
  const paces = splits.map((s) => s.paceSecPerKm);
  const fast = Math.min(...paces), slow = Math.max(...paces);
  const cap = ceilingFor(row.kind), over = splits.filter((s) => s.hr && !heldCeiling(s.hr, row.kind)).length;
  const width = (p) => 14 + ((slow - p) / Math.max(1, slow - fast)) * 86;   // quicker km = longer bar
  const summary = `${splits.length} km &middot; ${esc(fmtPace(fast))}–${esc(fmtPace(slow))}${AEROBIC.includes(row.kind) && splits.some((s) => s.hr) ? ` &middot; ${over ? `<span class="crit">${over} over ${cap}</span>` : `all under ${cap}`}` : ''}`;
  return `<button class="status-line" id="splits-toggle" aria-expanded="false" style="margin-top:22px;padding:0;">
      <span class="grow"><span class="mono">Splits</span><span class="sub">${summary}</span></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div id="splits-body" class="hide" style="margin-top:10px;">${splits.map((s) => {
      const quickest = s.paceSecPerKm === fast;
      return `<div class="split"><span class="n mono">${s.km}</span>
        <span class="bar"><i style="width:${width(s.paceSecPerKm).toFixed(1)}%;background:${quickest ? 'var(--gold)' : 'var(--ink-4)'}"></i></span>
        <span class="p num">${esc(fmtPace(s.paceSecPerKm))}</span>
        <span class="h mono" style="color:${s.hr && !heldCeiling(s.hr, row.kind) ? 'var(--crit)' : 'var(--ink-3)'}">${s.hr ?? '–'}</span></div>`;
    }).join('')}
    <p class="mono" style="margin-top:10px;">From Garmin's own distance, so a second or two off Strava</p></div>`;
}

function renderWeek() {
  const wk = curWeek(), rows = S.progress.rows.filter((r) => r.week === wk);
  const planned = rows.reduce((a, r) => a + r.plannedKm, 0), actual = rows.reduce((a, r) => a + (r.actualKm || 0), 0);
  const maxKm = Math.max(...rows.map((r) => Math.max(r.plannedKm, r.actualKm || 0)), 1);
  const DAYS = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
  const monday = (() => { const d = d8(S.progress.today); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return d; })();
  const cols = DAYS.map((dd, i) => {
    const date = new Date(monday); date.setDate(date.getDate() + i);
    const iso = isoLocal(date), r = rows.find((x) => x.date === iso);
    const isToday = iso === S.progress.today;
    if (!r) return `<div class="col ${isToday ? 'today' : ''}"><div class="rest" title="rest"></div><span class="km">&nbsp;</span><span class="dow">${dd}</span></div>`;
    const h = Math.max(22, (Math.max(r.plannedKm, r.actualKm || 0) / maxKm) * 78);
    const fill = r.actualKm ? Math.min(1, r.actualKm / Math.max(r.plannedKm, r.actualKm)) : 0;
    const cls = [isToday ? 'today' : '', r.status === 'missed' ? 'missed' : ''].join(' ');
    return `<div class="col ${cls}"><div class="stack" style="height:${h}px"><i data-fill="${fill}"></i></div>
      <span class="km">${r.actualKm ? km1(r.actualKm) : km1(r.plannedKm)}</span><span class="dow">${dd}</span></div>`;
  }).join('');
  const missed = rows.filter((r) => r.status === 'missed').length;
  $('s-week').innerHTML = `<div class="cardhead">
      <div class="grow"><div class="mono">This week &middot; ${rows.filter(done).length} of ${rows.length} runs</div>
        <p class="sub" style="margin-top:8px;"><b style="color:var(--ink)">${km1(actual)} km</b> of ${km1(planned)} planned${missed ? ` · ${missed === 1 ? 'one' : missed} missed` : ''}</p></div>
      ${ringSvg(planned > 0 ? actual / planned : 0, 'var(--gold)', km1(actual), 'of ' + km1(planned) + ' km', 84)}
    </div>
    <div class="strip" style="margin-top:14px;">${cols}</div>`;
  armRings($('s-week'));
  requestAnimationFrame(() => $('s-week').querySelectorAll('.stack i').forEach((i) => { i.style.transform = `scaleY(${i.dataset.fill})`; }));
}

function renderBlock(TARGET) {
  const rows = S.progress.rows, wk = curWeek(), weekNo = Number(wk.replace('W', '')) || 1;
  const byWeek = {};
  rows.forEach((r) => { (byWeek[r.week] = byWeek[r.week] || []).push(r); });
  const weeks = Object.keys(byWeek);
  const kmDone = rows.reduce((a, r) => a + (r.actualKm || 0), 0), kmAll = rows.reduce((a, r) => a + r.plannedKm, 0);
  const due = rows.filter((r) => r.status !== 'upcoming' && r.status !== 'today');
  // Each segment is one week, filled by the share of its kilometres actually banked.
  const wkIdx = weeks.indexOf(wk);
  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>';
  const bars = weeks.map((w, i) => {
    const ws = byWeek[w], p = ws.reduce((a, r) => a + r.plannedKm, 0), a = ws.reduce((x, r) => x + (r.actualKm || 0), 0);
    const st = i < wkIdx ? 'done' : i === wkIdx ? 'now' : 'future';
    return `<div class="chip ${st}" title="${esc(w)}: ${km1(a)} of ${km1(p)} km">${st === 'done' ? check : (i + 1)}</div>`;
  }).join('') + `<div class="chip race" title="Race day"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3v18l2-1 2 1 2-1 2 1 2-1 2 1V3z"/></svg></div>`;

  const longs = rows.filter((r) => r.kind === 'long');
  const longestDone = Math.max(0, ...longs.filter((r) => r.actualKm).map((r) => r.actualKm));
  const longestDue = Math.max(0, ...longs.filter((r) => r.status !== 'upcoming').map((r) => r.plannedKm));
  const mpKmOf = (d) => (sessionFor(d)?.steps || []).reduce((a, st) => a + (st.kind === 'mp' ? (st.reps || 1) * st.km : 0), 0);
  const mpDone = rows.reduce((a, r) => a + (r.mpEffortKm || 0), 0), mpDue = due.reduce((a, r) => a + mpKmOf(r.date), 0);
  const items = [
    ['Sessions', due.filter(done).length, due.length, 'runs'],
    ['Distance', Math.round(kmDone), Math.round(due.reduce((a, r) => a + r.plannedKm, 0)), 'km'],
    ['Long run', longestDone, longestDue, 'km'],
    ['Marathon pace', Math.round(mpDone), Math.round(mpDue), 'km'],
  ];
  ($('s-plan-block') && !TARGET ? $('s-plan-block') : $('s-block')).innerHTML = `<div class="cardhead">
      <div class="grow"><div class="mono">The 11 weeks &middot; gold is km banked</div>
        <p class="sub" style="margin-top:8px;"><b style="color:var(--ink)">Week ${weekNo}</b> &middot; ${dayDiff(S.progress.today, S.plan.race.date)} days to go &middot; ${km1(kmDone)} of ${km1(kmAll)} km run</p></div>
      ${ringSvg(kmAll > 0 ? kmDone / kmAll : 0, 'var(--gold)', `${Math.round((100 * kmDone) / Math.max(1, kmAll))}%`, 'of block', 84)}
    </div>
    <div class="wkchips" style="margin-top:14px;">${bars}</div>
    <div style="margin-top:22px;">${items.map(([label, got, need, unit]) => {
      const pct = need > 0 ? Math.min(100, (100 * got) / need) : 0;
      const ok = pct >= 90;
      const v = ok ? ['On track', 'good'] : pct >= 75 ? ['Close', 'dim'] : ['Behind', 'crit'];
      return `<div class="contrib"><div class="top"><span class="sub" style="color:var(--ink)">${esc(label)}</span><span class="verdict ${v[1]}">${v[0]}</span></div>
        <div class="track"><span class="tick" style="left:90%"></span><span class="mk" style="left:${pct}%;background:${ok ? 'var(--gold)' : 'var(--ink-2)'}"></span></div>
        <p class="sub" style="margin-top:7px;">${got} <span class="dim">of ${need} ${unit}</span></p></div>`;
    }).join('')}</div>`;
  const _blk = $('s-plan-block') || $('s-block');
  armRings(_blk);
  requestAnimationFrame(() => _blk.querySelectorAll('.wkseg i').forEach((i) => { i.style.transform = `scaleX(${i.dataset.fill})`; }));
}

/* Effort discipline: heart rate on every steady easy and long run, plotted as beats
   over or under the ceiling THAT run had (155 easy, 162 long). One line at zero, so a
   long run at 159 sits below it - under its own ceiling - instead of looking like a
   miss against the easy one. */
function effortChart() {
  const el = $('s-plan-effort') || $('s-ribbon');
  const runs = S.progress.rows.filter(steadyAerobic).slice(-12);
  if (runs.length < 2) { el.innerHTML = '<div class="mono">Easy-run heart rate</div><p class="sub" style="margin-top:8px;">Needs a couple more easy runs.</p>'; return; }
  const W = 350, H = 128, top = 26, bottom = 96;
  const over = (r) => r.actualHr - ceilingFor(r.kind);   // positive = over the ceiling
  const vals = runs.map(over);
  const lo = Math.min(...vals, -10) - 4, hi = Math.max(...vals, 6) + 4;
  const y = (v) => bottom - ((v - lo) / (hi - lo)) * (bottom - top);   // higher HR sits higher
  const x = (i) => 16 + (i * (W - 46)) / Math.max(1, runs.length - 1);
  const held = runs.filter((r) => heldCeiling(r.actualHr, r.kind)).length;
  let streak = 0;
  for (const r of [...runs].reverse()) { if (heldCeiling(r.actualHr, r.kind)) streak++; else break; }
  const line = runs.map((r, i) => `${i ? 'L' : 'M'}${x(i)},${y(over(r))}`).join('');
  const dots = runs.map((r, i) => {
    const ok = heldCeiling(r.actualHr, r.kind), last = i === runs.length - 1;
    return `<circle cx="${x(i)}" cy="${y(over(r))}" r="${last ? 6 : 4.5}" fill="${ok ? 'var(--gold)' : 'var(--crit)'}"
      ${last ? 'stroke="var(--ground)" stroke-width="2"' : ''}><title>${esc(KIND[r.kind])} ${esc(short(r.actualDate || r.date))}: HR ${Math.round(r.actualHr)} against ${ceilingFor(r.kind)}</title></circle>`;
  }).join('');
  const last = runs[runs.length - 1];
  const kinds = [...new Set(runs.map((r) => r.kind))].map((k) => `${ceilingFor(k)} ${KIND[k].toLowerCase()}`).join(', ');
  el.innerHTML = `<div class="mono">Easy-run heart rate &middot; last ${runs.length}</div>
    <p class="sub" style="margin-top:8px;">${streak >= 2
      ? `<span class="good">Last ${streak} runs under their ceiling.</span>`
      : `${held} of ${runs.length} under their ceiling.`} Each dot against its own ceiling (${esc(kinds)}); below the line is under it.</p>
    <svg class="chart" viewBox="0 0 ${W} ${H}" style="overflow:hidden;margin-top:6px;" role="img"
      aria-label="Heart rate on the last ${runs.length} easy and long runs, relative to each run's ceiling">
      <line class="ref" x1="16" x2="${W - 16}" y1="${y(0)}" y2="${y(0)}" stroke-dasharray="4 4"/>
      <text class="ax" x="16" y="${y(0) - 7}">ceiling</text>
      <path d="${line}" fill="none" stroke="var(--ink-4)" stroke-width="2" stroke-linejoin="round"/>
      ${dots}
      <text class="now" x="${x(runs.length - 1)}" y="${y(over(last)) - 14}" text-anchor="end">${Math.round(last.actualHr)} / ${ceilingFor(last.kind)}</text>
      <text class="ax" x="16" y="${H - 4}">${esc(d8(runs[0].actualDate || runs[0].date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }))}</text>
      <text class="ax" x="${W - 16}" y="${H - 4}" text-anchor="end">latest</text>
    </svg>`;
}

function renderOutlook() {
  const p = S.progress.prediction, ff = p?.fadeForecast, el = $('s-outlook');
  if (!p?.available) { el.innerHTML = `<div class="mono">Outlook</div><p class="sub" style="margin-top:8px;">${esc(p?.message || '')}</p>`; return; }
  const longestMp = Math.max(0, ...S.progress.rows.map((r) => r.mpEffortKm || 0));
  const best = S.progress.rows.filter((r) => r.mpEffortKm).slice(-1)[0];
  // Two numbers tell the story: what the marathon-pace sessions say if you hold even pace,
  // and what your long runs say happens in the second half. The working is one tap away.
  const fading = ff?.available && ff.appliedFadePenaltySecPerKm > 0;
  const gapSec = fading ? ff.forecastFinishSec - p.avgPredictedSec : 0;
  const gapLabel = `${Math.floor(gapSec / 60)}:${String(Math.round(gapSec % 60)).padStart(2, '0')}`;
  const oneLine = fading
    ? `Your steady long runs slow ${Math.round(ff.avgFadeSecPerKm)} s/km in the second half: ${esc(ff.firstHalfPaceLabel)} out, ${esc(ff.secondHalfPaceLabel)} back.`
    : ff?.available ? 'No fade on your steady long runs yet, so the even-pace number stands.'
    : 'Needs a steady long run with splits before a fade can be read.';
  el.innerHTML = `<div class="mono">If today's pattern holds</div>
    <div class="dual" style="margin-top:12px;">
      <div><div class="second num gold" id="fade-n">${esc(fading ? ff.forecastFinishLabel : p.avgPredictedLabel)}</div><div class="mono" style="margin-top:6px;">${fading ? 'with your fade' : 'even pace'}</div></div>
      ${fading ? `<div><div class="second num dim">${esc(p.avgPredictedLabel)}</div><div class="mono" style="margin-top:6px;">even pace &middot; ${esc(gapLabel)} quicker</div></div>` : ''}
    </div>
    <p class="sub" style="margin-top:10px;">${oneLine}</p>
    <div style="margin-top:16px;">
      <div class="row"><div class="grow"><div class="sub">Longest marathon-pace block held</div><div class="meta mono">${best ? `${esc(best.mpEffortPaceLabel)}/km${best.mpEffortHr ? ` at hr ${Math.round(best.mpEffortHr)}` : ''}` : 'none yet'}</div></div><div class="val">${km1(longestMp)} km</div></div>
      <div class="row"><div class="grow"><div class="sub">Goal</div><div class="meta mono">${esc(S.plan.race.stretch_pace)} for 42.195 km</div></div><div class="val">${esc(S.plan.race.stretch_time)}</div></div>
    </div>
    ${p.fasterThanMpCount ? `<p class="sub crit" style="margin-top:12px;">${p.fasterThanMpCount} of ${p.qualifyingCount} marathon-pace sessions ran faster than the band, so this assumes a pace you have held for ${km1(longestMp)} km, not 42.</p>` : ''}
    <button class="linkish" id="outlook-more" style="margin-top:12px;">How this was worked out</button>
    <p class="sub hide" id="outlook-body" style="margin-top:8px;">${esc(p.message)} ${esc(ff?.message || '')}</p>`;
  $('outlook-more').addEventListener('click', () => $('outlook-body').classList.toggle('hide'));
  countUp($('fade-n'), (fading ? ff.forecastFinishSec : p.avgPredictedSec) ?? 0, (v) => fmtHMS(v), 700);
}

async function loadNow(force) {
  const q = force ? '?refresh=1' : '';
  getJSON('/api/weather').then((wx) => { S.weather = wx; if (!$('s-summary').hidden) safe('summary', $('s-summary'), renderSummary); }).catch(() => {});
  const [plan, progress, readiness, insights, feel, fuelToday] = await Promise.all([
    getJSON('/api/plan'), getJSON('/api/progress' + q),
    getJSON('/api/readiness' + q).catch(() => null),
    getJSON('/api/insights' + q).catch(() => ({ insights: [] })),
    getJSON('/api/feel').catch(() => ({ feels: {} })),
    getJSON('/api/fuel').catch(() => null),   // one line of before-run fuel belongs on "what now"
  ]);
  Object.assign(S, { plan, progress, readiness, insights: insights.insights, feels: feel.feels || {}, fuelToday });
  adoptPlanConstants(plan);
  S.moment = moment();
  $('hdr-week').textContent = curWeek().replace('W', 'W');
  $('hdr-phase').textContent = `${PHASE[curWeek()] || ''} · ${dayDiff(progress.today, plan.race.date)} days`;
  $('now-skel').hidden = true; $('now-body').hidden = false;
  // A calm home: today, and the last run. The week, the block, the effort
  // trend and the full outlook moved to Plan or behind a tap - the old screen
  // stacked eight dense sections and was hard to follow.
  ['s-status', 's-week', 's-block', 's-ribbon', 's-outlook'].forEach((id) => { const e = $(id); if (e) { e.hidden = true; e.innerHTML = ''; } });
  safe('summary', $('s-summary'), renderSummary);
  safe('today', $('s-hero'), renderHero);

  // The route is a second request, so it arrives after the screen is usable.
  // After the race, the route IS the race.
  const ra = progress.raceActivity;
  const lastRun = ra
    ? { kind: 'mp', race: true, date: ra.date, actualDate: null, activityId: ra.activityId, actualKm: ra.km }
    : [...progress.rows].reverse().find((r) => done(r) && r.activityId);
  if (lastRun) {
    S.routeRow = lastRun;
    getJSON(`/api/route?activityId=${lastRun.activityId}`)
      .then((rt) => { S.route = rt; const c = $('sheet-route'); if (c) safe('the route', c, () => renderRoute(c)); })
      .catch(() => {});
  }
}

/* ---------- PLAN ---------- */
function renderFuel() {
  const f = S.fuelToday, h = S.hydration, el = $('s-fuel');
  if (!f) { el.innerHTML = '<p class="sub">Fuel unavailable.</p>'; return; }
  const d = f.during, waterPct = h?.goalMl ? Math.min(100, (100 * h.valueMl) / h.goalMl) : 0;
  const trio = [[f.carbsG ? `${f.carbsG[0]}–${f.carbsG[1]}` : '–', 'g carbs'], [f.proteinG ? `${f.proteinG[0]}–${f.proteinG[1]}` : '–', 'g protein'], [h ? (h.valueMl / 1000).toFixed(1) : '–', `of ${h ? (h.goalMl / 1000).toFixed(1) : '–'} l water`]];

function progressionChart() {
  const rows = S.progress.rows, byWeek = {};
  rows.forEach((r) => { (byWeek[r.week] = byWeek[r.week] || []).push(r); });
  const weeks = Object.keys(byWeek), wk = curWeek();
  const W = 350, H = 96, bw = 22, gap = (W - weeks.length * bw) / (weeks.length - 1);
  const maxKm = Math.max(...weeks.map((w) => byWeek[w].reduce((a, r) => a + r.plannedKm, 0)));
  const bars = weeks.map((w, i) => {
    const ws = byWeek[w], p = ws.reduce((a, r) => a + r.plannedKm, 0), a = ws.reduce((x, r) => x + (r.actualKm || 0), 0);
    const x = i * (bw + gap), h = (p / maxKm) * 72, y = 80 - h, ah = Math.min(h, (a / maxKm) * 72);
    const future = ws.every((r) => r.status === 'upcoming');
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="var(--ground-3)" opacity="${future ? .6 : 1}"/>
      ${ah > 0 ? `<rect class="gy" x="${x}" y="${80 - ah}" width="${bw}" height="${ah}" rx="6" fill="var(--gold)"/>` : ''}
      ${w === wk ? `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="none" stroke="var(--ink)" stroke-width="1.5"/>` : ''}`;
  }).join('');
  $('s-progression').innerHTML = `<div class="mono">The block &middot; weekly km</div>
    <svg class="chart drawn" viewBox="0 0 ${W} ${H}" role="img" aria-label="Planned and completed distance for each of the 11 weeks">
      ${bars}<circle cx="${(weeks.length - 1) * (bw + gap) + bw / 2}" cy="12" r="5" fill="var(--gold)"/>
      <text class="ax" x="0" y="${H - 2}">W1</text><text class="ax" x="${W}" y="${H - 2}" text-anchor="end">Race</text>
    </svg>`;
}

/* The tail of a plan row says how the session was judged, in the unit it was judged in:
   a done easy run shows HR against its ceiling; an MP-finish long run shows the finish
   against the MP band; quality sessions and anything not yet run show the pace band. */
function rowVerdict(r, s) {
  if (!s.paceHi) return '';
  const ran = done(r);
  if (ran && AEROBIC.includes(r.kind) && r.mpEffortKm) {
    const mp = (s.steps || []).find((st) => st.kind === 'mp');
    if (mp && r.mpEffortPace) {
      const fast = toSec(mp.paceFast), slow = toSec(mp.paceSlow);
      return bandStrip(fast, slow, r.mpEffortPace, fast <= r.mpEffortPace && r.mpEffortPace <= slow);
    }
  }
  if (ran && AEROBIC.includes(r.kind) && r.actualHr) {
    const ok = heldCeiling(r.actualHr, r.kind);
    return `<span class="val ${ok ? '' : 'crit'}" title="average HR against this run's ceiling">${Math.round(r.actualHr)} <span class="dim">/ ${ceilingFor(r.kind)}</span></span>`;
  }
  return bandStrip(toSec(s.paceHi), toSec(s.paceLo), ran ? r.actualPace ?? null : null, r.inZone);
}

/* Tapping a session shows its steps and what to eat around it. */
async function openSessionSheet(date) {
  const s = sessionFor(date), r = rowFor(date);
  if (!s) return;
  openSheet(r?.label || KIND[s.kind], `
    <p class="mono">${esc(short(date))} &middot; ${km1(s.km)} km &middot; ${esc(mins(s.durationMin))} &middot; target ${esc(s.paceHi)}–${esc(s.paceLo)}/km</p>

function renderRace() {
  const rp = S.racePlan, el = $('s-race');
  if (!rp) { el.innerHTML = '<p class="sub">Race plan unavailable.</p>'; return; }
  const p = rp.pacing, f = rp.fuel, W = 350, H = 112;
  const paces = p.segments.map((s) => toSec(s.paceLabel));
  const lo = Math.min(...paces) - 12, hi = Math.max(...paces) + 12;
  const x = (km) => (km / 42.195) * W, y = (pc) => 20 + ((pc - lo) / (hi - lo)) * 56;
  const steps = p.segments.map((s) => `M${x(s.fromKm)},${y(toSec(s.paceLabel))} L${x(s.toKm)},${y(toSec(s.paceLabel))}`).join(' ');
  const gels = (f.gels || []).map((g) => `<line x1="${x(g.km)}" x2="${x(g.km)}" y1="84" y2="92" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>`).join('');
  el.innerHTML = `<div class="mono">Race day &middot; goal ${esc(p.goalLabel)} &middot; ${esc(p.goalPaceLabel)}/km</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Race pace plan by kilometre with gel timings">
      <path d="${steps}" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linejoin="round"/>
      <line class="ref" x1="${x(21.1)}" x2="${x(21.1)}" y1="14" y2="80"/>
      <text class="ax" x="${x(21.1)}" y="10" text-anchor="middle">half ${esc(p.halfwayLabel)}</text>
      ${gels}<text class="ax" x="0" y="${H - 2}">${esc(f.gelCount)} gels</text>
      <text class="ax" x="${W}" y="${H - 2}" text-anchor="end">42.2 km</text>
    </svg>
    <div style="margin-top:14px;">${p.segments.map((s) => `<div class="row"><div class="grow"><div class="sub">${km1(s.fromKm)}–${km1(s.toKm)} km</div><div class="meta mono">by ${esc(s.elapsedAtEndLabel)}</div></div><div class="val">${esc(s.paceLabel)}/km</div></div>`).join('')}</div>
    <button class="linkish" id="race-more" style="margin-top:12px;">Fuel, race morning and carb load</button>
    <div class="hide" id="race-detail" style="margin-top:12px;">
      <p class="sub">${esc(f.fluidNote || '')} Carbs ${f.carbsPerHour?.[0]}–${f.carbsPerHour?.[1]} g/h, fluid ${f.fluidMlPerHour?.[0]}–${f.fluidMlPerHour?.[1]} ml/h.</p>
      <p class="sub" style="margin-top:10px;">${esc(rp.raceMorning?.text || '')}</p>
      <p class="sub" style="margin-top:10px;">${esc(rp.carbLoad?.text || '')}</p>

async function loadPlan(force) {
  const q = force ? '?refresh=1' : '';

    getJSON('/api/fuel').catch(() => null), getJSON('/api/hydration' + q).catch(() => null),
    getJSON('/api/race-plan').catch(() => null), getJSON('/api/gear' + q).catch(() => ({ shoes: [] })),
  ]);

/* One job per view: Schedule (the weeks + race day), Progress (tracking +
   effort trend), Fuel (targets + gear). The old Plan stacked all three. */
function setupPlanSeg() {
  const tabs = document.querySelectorAll('#plan-seg [role=tab]');
  if (!tabs.length) return;
  const show = (name) => {
    tabs.forEach((b) => b.setAttribute('aria-selected', String(b.dataset.seg === name)));
    document.querySelectorAll('#plan-body [data-group]').forEach((sec) => { sec.hidden = sec.dataset.group !== name; });
  };
  tabs.forEach((b) => b.addEventListener('click', () => show(b.dataset.seg)));
  show(S.planSeg || 'plan');
  tabs.forEach((b) => b.addEventListener('click', () => { S.planSeg = b.dataset.seg; }));
}

function renderStress() {
  const st = S.mind.stress, days = S.mind.stressDays || [], el = $('s-stress');
  if (!st?.available || !days.length) { el.innerHTML = `<div class="mono">Stress</div><p class="sub" style="margin-top:8px;">${esc(st?.message || 'No stress data.')}</p>`; return; }
  const W = 350, H = 112, base = st.baselineAvg;
  const hi = Math.max(60, ...days.map((d) => d.avg)) * 1.1;
  const y = (v) => 88 - (v / hi) * 68;
  const runDates = new Set(S.progress?.rows?.filter((r) => r.actualKm).map((r) => r.actualDate || r.date) || []);
  const marks = days.map((d, i) => {
    const x = 16 + (i * (W - 40)) / Math.max(1, days.length - 1);
    const run = runDates.has(d.date), last = i === days.length - 1;
    const hot = base && d.avg > base + 10;
    return `<line x1="${x}" x2="${x}" y1="${y(base || d.avg)}" y2="${y(d.avg)}" stroke="${hot ? 'var(--crit)' : 'var(--ink-4)'}" stroke-width="1" opacity=".6"/>
      <circle cx="${x}" cy="${y(d.avg)}" r="${last ? 5 : 4}" fill="${last ? 'var(--ink)' : run ? 'none' : 'var(--ink-2)'}" ${run && !last ? 'stroke="var(--ink-2)" stroke-width="1.5"' : ''}/>
      ${last ? `<text class="now" x="${x}" y="${y(d.avg) - 12}" text-anchor="end">${d.avg}</text>` : ''}`;
  }).join('');
  const word = st.verdict === 'elevated' ? 'elevated' : st.verdict === 'low' ? 'calm' : 'steady';
  el.innerHTML = `<div class="mono">Stress &middot; ${esc(word)}</div>
    <div class="second num" style="margin-top:8px;">${st.latest.avg}</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily stress against your baseline">
      ${base ? `<line class="ref" x1="12" x2="${W - 12}" y1="${y(base)}" y2="${y(base)}"/><text class="ax" x="12" y="${y(base) - 6}">your normal ${base}</text>` : ''}
      ${marks}
      <text class="ax" x="12" y="${H - 2}">${esc(days[0].date.slice(8))}/${esc(days[0].date.slice(5, 7))}</text>
      <text class="ax" x="${W - 12}" y="${H - 2}" text-anchor="end">yesterday</text>
    </svg>`;
}

function renderSleep() {
  const sl = S.mind.sleep || {}, sm = sl.summary || {}, nights = (sl.entries || []).slice(-10), el = $('s-sleep');
  if (!nights.length) { el.innerHTML = '<div class="mono">Sleep</div><p class="sub" style="margin-top:8px;">No sleep data.</p>'; return; }
  const W = 350, H = 96, bw = 6;
  const gap = (W - 24 - nights.length * bw) / Math.max(1, nights.length - 1);
  const y = (h) => 78 - (h / 10) * 62;
  const bars = nights.map((n, i) => {
    const x = 12 + i * (bw + gap), last = i === nights.length - 1;
    const c = last ? 'var(--ink)' : n.hours >= 7 ? 'var(--ink-2)' : n.hours >= 6 ? 'var(--ink-3)' : 'var(--crit)';
    return `<rect class="gy" x="${x}" y="${y(n.hours)}" width="${bw}" height="${78 - y(n.hours)}" rx="3" fill="${c}"/>
      ${last ? `<text class="now" x="${x + bw / 2}" y="${y(n.hours) - 8}" text-anchor="middle">${n.hours}</text>` : ''}`;
  }).join('');
  el.innerHTML = `<div class="mono">Sleep &middot; avg ${sm.avgHours ?? '–'}h over ${sm.nightsLogged ?? nights.length} nights</div>
    <div class="second num" style="margin-top:8px;">${sm.latestHours ?? '–'}<small style="font:400 16px var(--f-ui);color:var(--ink-2);">h</small></div>

  $('body-skel').hidden = true; $('body-body').hidden = false;
  safe('the check-in', $('s-checkin'), renderCheckin);
  safe('stress', $('s-stress'), renderStress);
  safe('sleep', $('s-sleep'), renderSleep);
  safe('body', $('s-weight'), renderWeightRow);
}

/* ---------- sheets ---------- */
const sheet = $('sheet');
function openRunSheet() {
  if (!S.routeRow) { toast('No recent run yet'); return; }
  openSheet('Last run', '<div id="sheet-route"></div>', () => {
    const c = $('sheet-route');
    if (S.route) safe('the route', c, () => renderRoute(c));
    else c.innerHTML = '<p class="sub">Loading route…</p>';
  });
}
function openOutlookSheet() {
  openSheet('Outlook', '<div id="sheet-outlook"></div>', () => {
    const c = $('sheet-outlook'), save = $('s-outlook');
    // renderOutlook writes to #s-outlook; borrow it, then move the markup into the sheet
    renderOutlook();
    c.innerHTML = save.innerHTML;
    const more = c.querySelector('#outlook-more');
    if (more) more.addEventListener('click', () => c.querySelector('#outlook-body').classList.toggle('hide'));
  });
}

function openSheet(title, html, after) {
  $('sheet-title').textContent = title; $('sheet-body').innerHTML = html;
  sheet.showModal(); if (after) after();
}
$('sheet-close').addEventListener('click', () => sheet.close());
sheet.addEventListener('click', (e) => {
  const r = sheet.getBoundingClientRect();
  if (e.target === sheet && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) sheet.close();
});

function openWeightSheet() {
  openSheet('Log weight', `<div class="stack">
    <label><span class="mono">Weight (kg)</span><input id="w-kg" type="number" step="0.1" min="30" max="200"></label>
    <label><span class="mono">Date</span><input id="w-date" type="date"></label>
    <button class="ghost wide" id="w-save">Save to Garmin</button><p class="sub" id="w-msg"></p></div>`, () => {
    $('w-date').valueAsDate = new Date();
    $('w-save').addEventListener('click', async () => {
      try {
        await postJSON('/api/weight', { weight: Number($('w-kg').value), date: $('w-date').value });
        S.weight = await getJSON('/api/weight?refresh=1'); renderWeightRow(); sheet.close(); toast('Weight logged');
      } catch (e) { $('w-msg').textContent = e.message; $('w-msg').className = 'sub crit'; }
    });
  });
}

function openSweatSheet() {
  openSheet('Sweat test', `<div class="stack">
    <p class="sub">Weigh yourself before and after a run, without clothes, and count what you drank.</p>
    <label><span class="mono">Before (kg)</span><input id="s-pre" type="number" step="0.1"></label>
    <label><span class="mono">After (kg)</span><input id="s-post" type="number" step="0.1"></label>
    <label><span class="mono">Minutes</span><input id="s-min" type="number" step="1" min="10"></label>
    <label><span class="mono">Drank (ml)</span><input id="s-ml" type="number" step="50" value="0"></label>
    <button class="ghost wide" id="s-go">Work it out</button><div id="s-out"></div></div>`, () => {
    $('s-go').addEventListener('click', async () => {
      try {
        const r = await postJSON('/api/sweat-rate', { preKg: Number($('s-pre').value), postKg: Number($('s-post').value), durationMin: Number($('s-min').value), fluidMl: Number($('s-ml').value || 0) });
        S.sweat = r;
        $('s-out').innerHTML = `<div class="second num gold" style="margin-top:10px;">${r.sweatRateLPerHr}<small style="font:400 16px var(--f-ui);color:var(--ink-2);"> L/h</small></div>
          <p class="sub" style="margin-top:8px;">${esc(r.guidance)}</p>`;
        renderWeightRow();
      } catch (e) { $('s-out').innerHTML = `<p class="sub crit">${esc(e.message)}</p>`; }
    });
  });
}

$('settings-btn').addEventListener('click', () => {
  openSheet('Settings', `<div class="stack">
    <p class="mono">Version {{ build }}</p>
    <form method="post" action="/gate/logout" id="lock-form"><button class="ghost wide" type="submit">Lock app</button></form>
    <button class="ghost wide" id="signout">Sign out of Garmin</button>
    <p class="sub">Lock asks for the app password again on this device. Signing out disconnects Garmin until the owner signs in again.</p></div>`, () => {
    if (!S.gateEnabled) $('lock-form').hidden = true;
    $('signout').addEventListener('click', async () => {
      if (!confirm('Sign out of Garmin? The app stops syncing until the owner signs in again.')) return;
      await postJSON('/api/logout', {}); location.reload();
    });
  });
});

/* ---------- tabs ---------- */
const loaded = {};
const loaders = { now: loadNow, plan: loadPlan, body: loadBody };
function loadTab(name, force = false) {
  if (!loaded[name] || force) {
    const p = (async () => { if (name !== 'now' && !S.progress) await loadTab('now'); await loaders[name](force); })();
    loaded[name] = p; p.catch(() => { if (loaded[name] === p) loaded[name] = null; });
  }
  return loaded[name];
}
function moveSlider(btn) {
  const s = $('nav-slider'), r = btn.getBoundingClientRect(), p = btn.parentElement.getBoundingClientRect();
  s.style.width = '20px';
  s.style.transform = `translateX(${r.left - p.left + r.width / 2 - 10}px)`;
}
async function showTab(name, force = false) {
  document.querySelectorAll('nav.tabs [role=tab]').forEach((b) => {
    const on = b.dataset.tab === name;
    b.setAttribute('aria-selected', String(on));
    if (on) moveSlider(b);
  });
  document.querySelectorAll('main > .view').forEach((v) => { v.hidden = v.id !== `view-${name}`; });
  if (location.hash !== `#${name}`) history.replaceState(null, '', `#${name}`);
  const view = $(`view-${name}`);
  try { await loadTab(name, force); }
  catch (e) { if (e.message !== 'locked') view.insertAdjacentHTML('afterbegin', `<p class="sub crit">Couldn't load from Garmin: ${esc(e.message)}</p>`); }
  if (!view.dataset.entered) { view.classList.add('fresh'); view.dataset.entered = '1'; }
}
document.querySelectorAll('nav.tabs [role=tab]').forEach((b) => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo({ top: 0 }); }));
window.addEventListener('resize', () => { const on = document.querySelector('nav.tabs [aria-selected=true]'); if (on) moveSlider(on); });

$('refresh-btn').addEventListener('click', async () => {
  const btn = $('refresh-btn'); btn.classList.add('spin');
  const cur = document.querySelector('nav.tabs [aria-selected=true]').dataset.tab;
  Object.keys(loaded).forEach((k) => { loaded[k] = null; });
  try { await showTab(cur, true); } finally { btn.classList.remove('spin'); }
  prefetch();
});
async function prefetch() { for (const n of ['plan', 'body']) { try { await loadTab(n); } catch { /* shown when opened */ } } }

/* ---------- connection ---------- */
let pollTimer = null;
function showConnect(state) {
  $('app-view').hidden = true; $('connect-view').hidden = false;
  const busy = state.status === 'logging_in', mfa = state.status === 'awaiting_mfa';
  $('connect-busy').hidden = !busy; $('mfa-form').hidden = !mfa;
  if (mfa || busy) { $('login-form').hidden = true; $('owner-btn').hidden = true; }
  const err = $('connect-error'); err.hidden = !state.error; err.textContent = state.error || '';
}
async function poll() {
  const st = await getJSON('/api/session');
  if (st.status === 'logged_in') { clearInterval(pollTimer); pollTimer = null; enterApp(st); return; }
  if (st.status === 'error') { clearInterval(pollTimer); pollTimer = null; $('owner-btn').hidden = true; $('login-form').hidden = false; }
  showConnect(st);
}
$('owner-btn').addEventListener('click', () => { $('owner-btn').hidden = true; $('login-form').hidden = false; $('email').focus(); });
$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault(); $('login-btn').disabled = true;
  await postJSON('/api/login', { email: $('email').value, password: $('password').value });
  if (!pollTimer) pollTimer = setInterval(poll, 1200);
});
$('mfa-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  await postJSON('/api/mfa', { code: $('mfa').value });
  if (!pollTimer) pollTimer = setInterval(poll, 1200);
});

function enterApp(state) {
  S.gateEnabled = state.gateEnabled;
  $('connect-view').hidden = true; $('app-view').hidden = false;
  const start = ['now', 'plan', 'body'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'now';
  showTab(start).then(() => setTimeout(prefetch, 300));
}

(async function init() {
  try {
    const st = await getJSON('/api/session');
    if (st.status === 'logged_in') enterApp(st); else showConnect(st);
  } catch (e) { if (e.message !== 'locked') showConnect({ status: 'error', error: e.message }); }
})();
</script>
</body>
</html>
