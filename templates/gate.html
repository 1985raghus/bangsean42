<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bangsaen">
  <title>Bangsaen Training</title>
  <link rel="icon" href="/static/logo-small.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;600;700&display=swap">
  <style>
    /* Dark only, matching the app. */
    :root {
      color-scheme: dark;
      --brand: #1f5cff; --brand-deep: #0a2a8f; --page: #0b1020; --surface: #151b2e; --field: #0b1020;
      --ink: #ffffff; --ink-2: #b9c0d6; --hair: rgba(255, 255, 255, .10); --crit: #ff6b6b;
      --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --display: "Anton", Impact, "Arial Narrow", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; color: var(--ink); font: 15px/1.5 var(--font);
      background: radial-gradient(90% 60% at 100% 0%, #3b72ff 0%, var(--brand) 30%, var(--brand-deep) 60%, var(--page) 100%); }
    form { width: 100%; max-width: 360px; background: var(--surface); border-radius: 20px; padding: 28px 22px 22px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 24px 60px -24px rgba(0, 0, 0, .7); }
    .eyebrow { font-size: 11.5px; color: var(--ink-2); font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    h1 { font-family: var(--display); font-weight: 400; font-size: 36px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; margin: 8px 0 20px; }
    label { display: block; font-size: 13px; color: var(--ink-2); font-weight: 600; margin: 0 0 6px; }
    input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--hair); border-radius: 12px; background: var(--field); color: var(--ink); font: 16px var(--font); }
    button { width: 100%; min-height: 46px; margin-top: 14px; border: 0; border-radius: 14px; background: var(--brand); color: #fff; font: 700 15px var(--font); cursor: pointer; }
    :is(input, button):focus-visible { outline: 2px solid #8fb0ff; outline-offset: 2px; }
    .error { color: var(--crit); font-size: 13.5px; font-weight: 600; margin: 0 0 12px; }
    .logo { display: block; width: 64px; height: 64px; margin-bottom: 18px; filter: drop-shadow(0 12px 22px rgba(4, 12, 48, .6)); }
  </style>
</head>
<body>
  <form method="post" action="/gate">
    <img class="logo" src="/static/logo.svg" alt="" width="64" height="64">
    <div class="eyebrow">Bangsaen Marathon &middot; Nov 15</div>
    <h1>Training HQ</h1>
    {% if error %}<p class="error">{{ error }} &mdash; try again.</p>{% endif %}
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" autofocus required>
    <button type="submit">Open</button>
  </form>
</body>
</html>
