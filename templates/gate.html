<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bangsaen Tracker</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1652f0; font-family: system-ui, sans-serif; padding: 20px;
    }
    .card {
      background: #fff; border: 3px solid #0a0a0a; border-radius: 14px; padding: 32px 28px;
      box-shadow: 6px 6px 0 #0a0a0a; width: 100%; max-width: 340px;
    }
    h1 { font-size: 18px; margin: 0 0 4px; text-transform: uppercase; letter-spacing: .02em; }
    p.sub { font-size: 13px; color: #62626a; margin: 0 0 20px; }
    input {
      width: 100%; padding: 11px 12px; border: 2px solid #0a0a0a; border-radius: 8px;
      font-size: 15px; margin-bottom: 14px;
    }
    button {
      width: 100%; padding: 11px; border: 3px solid #0a0a0a; border-radius: 10px;
      background: #ff2d2d; color: #fff; font-weight: 700; font-size: 14px; text-transform: uppercase;
      letter-spacing: .02em; cursor: pointer; box-shadow: 3px 3px 0 #0a0a0a;
    }
    .error { color: #d0021b; font-size: 13px; margin: -6px 0 14px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/gate">
    <h1>Bangsaen Tracker</h1>
    <p class="sub">Enter the app password to continue.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit">Continue</button>
  </form>
</body>
</html>
